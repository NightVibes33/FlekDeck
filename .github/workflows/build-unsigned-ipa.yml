name: Build signer-compatible IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/multitask-control-jit-diagnosis
      - experiment/parallel-guest-layout-safearea
      - feature/boot-menu-zip-import
    paths:
      - '.github/trigger-unsigned-ipa'
      - '.github/workflows/build-unsigned-ipa.yml'
      - 'LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift'
      - 'LiveContainerSwiftUI/LiveContainerSwiftUI-Bridging-Header.h'
      - 'LiveContainerSwiftUI/Views/Bootloader/**'
      - 'LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift'
      - 'docs/flek-bootloader-parity.md'
      - 'LiveProcess/**'
      - 'Tools/prepare_flekdeck_pe_runtime.py'
      - 'Tools/patch_*.py'
      - 'Tools/PEClientVRoot.c'
      - 'Tools/test_flek_rom_archive.m'
      - 'ThirdParty/FlekDeckPERuntime-NOTICE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      VIBE_SHA: 318d7b0380898840da81c99278b39729147f7fea
      VIBE_ROOT: /tmp/vibe/LiveContainer-3.8.0
      NYXIAN_PE_SHA: 350dd8dbeb796bc0ff5bc91ef770f1a2994432e7
    steps:
      - name: Checkout FlekDeck without recursive submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
          fetch-depth: 1

      - name: Fetch pinned VibeContainers and OpenSSL
        run: |
          set -euo pipefail
          rm -rf /tmp/vibe OpenSSL
          git clone --filter=blob:none --no-checkout https://github.com/NightVibes33/VibeContainers.git /tmp/vibe
          git -C /tmp/vibe fetch --no-tags origin "$VIBE_SHA"
          git -C /tmp/vibe checkout --detach "$VIBE_SHA"
          VIBE_OPENSSL="$(git -C /tmp/vibe rev-parse "$VIBE_SHA:LiveContainer-3.8.0/OpenSSL")"
          git clone --filter=blob:none --no-checkout https://github.com/krzyzanowskim/OpenSSL.git OpenSSL
          git -C OpenSSL fetch --no-tags origin "$VIBE_OPENSSL"
          git -C OpenSSL checkout --detach "$VIBE_OPENSSL"

      - name: Test ROM extraction through iOS-style ancestor symlinks
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -framework Foundation \
            Tools/test_flek_rom_archive.m \
            LiveContainerSwiftUI/Views/Bootloader/FlekROMArchive.m \
            -larchive -o /tmp/flek-rom-archive-test
          /tmp/flek-rom-archive-test

      - name: Copy exact Vibe signing JIT runtime
        run: |
          set -euo pipefail
          V="$VIBE_ROOT"

          # These files own the Home/Parallel switcher behavior that is already
          # verified on-device. The Vibe overlay must never mutate them silently.
          protected_switcher_files=(
            MultitaskSupport/MultitaskDockView.swift
            MultitaskSupport/DecoratedAppSceneViewController.m
            MultitaskSupport/MultitaskAppWindow.swift
          )
          shasum -a 256 "${protected_switcher_files[@]}" > /tmp/flek-switcher-before.sha256

          files=(
            LiveContainer/LCBootstrap.m
            LiveContainer/LCMachOUtils.h
            LiveContainer/LCMachOUtils.m
            LiveContainer/LCSharedUtils.h
            LiveContainer/LCSharedUtils.m
            LiveContainer/dyld_bypass_validation.h
            LiveContainer/dyld_bypass_validation.m
            LiveContainer/main.c
            LiveContainer/utils.h
            LiveContainer/utils.m
            LiveContainer/Tweaks/Dyld.m
            LiveContainer/Tweaks/Tweaks.h
            LiveContainerSwiftUI/Utilities/LCUtils.h
            LiveContainerSwiftUI/Utilities/LCUtils.m
            LiveContainerSwiftUI/Utilities/LCUtilsExtensions.swift
            LiveContainerSwiftUI/Utilities/unarchive.h
            LiveContainerSwiftUI/Utilities/unarchive.m
            LiveContainerSwiftUI/Models/LCAppInfo.h
            LiveContainerSwiftUI/Models/LCAppInfo.m
            LiveContainerSwiftUI/Models/LCAppModel.swift
            LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
            LiveProcess/SideStoreLiveProcessHandler.m
            TweakLoader/DocumentPicker.m
            TweakLoader/Notification.m
            TweakLoader/TweakLoader.m
            TweakLoader/UIKit+GuestHooks.m
            TweakLoader/utils.h
            TweakLoader/utils.m
            entitlements.xml
            entitlements.catalyst.xml
          )
          for p in "${files[@]}"; do cp "$V/$p" "$p"; done

          shasum -a 256 "${protected_switcher_files[@]}" > /tmp/flek-switcher-after.sha256
          diff -u /tmp/flek-switcher-before.sha256 /tmp/flek-switcher-after.sha256
          echo "FlekDeck-owned Home/Parallel switcher sources survived Vibe overlay unchanged."

          mkdir -p SideStore
          cp "$V/SideStore/XPCServer.h" SideStore/XPCServer.h
          rm -rf TestJITLess ZSign litehook
          cp -R "$V/TestJITLess" TestJITLess
          cp -R "$V/ZSign" ZSign
          cp -R "$V/litehook" litehook

      - name: Prove exact Vibe core
        run: |
          set -euo pipefail
          V="$VIBE_ROOT"
          files=(
            LiveContainer/LCBootstrap.m
            LiveContainer/LCMachOUtils.h
            LiveContainer/LCMachOUtils.m
            LiveContainer/LCSharedUtils.h
            LiveContainer/LCSharedUtils.m
            LiveContainer/dyld_bypass_validation.h
            LiveContainer/dyld_bypass_validation.m
            LiveContainer/main.c
            LiveContainer/utils.h
            LiveContainer/utils.m
            LiveContainer/Tweaks/Dyld.m
            LiveContainer/Tweaks/Tweaks.h
            LiveContainerSwiftUI/Utilities/LCUtils.h
            LiveContainerSwiftUI/Utilities/LCUtils.m
            LiveContainerSwiftUI/Utilities/LCUtilsExtensions.swift
            LiveContainerSwiftUI/Utilities/unarchive.h
            LiveContainerSwiftUI/Utilities/unarchive.m
            LiveContainerSwiftUI/Models/LCAppInfo.h
            LiveContainerSwiftUI/Models/LCAppInfo.m
            LiveContainerSwiftUI/Models/LCAppModel.swift
            LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
            LiveProcess/SideStoreLiveProcessHandler.m
            TweakLoader/DocumentPicker.m
            TweakLoader/Notification.m
            TweakLoader/TweakLoader.m
            TweakLoader/UIKit+GuestHooks.m
            TweakLoader/utils.h
            TweakLoader/utils.m
            entitlements.xml
            entitlements.catalyst.xml
          )
          for p in "${files[@]}"; do
            test "$(git hash-object "$p")" = "$(git -C /tmp/vibe rev-parse "$VIBE_SHA:LiveContainer-3.8.0/$p")" || { echo "VIBE PARITY FAIL: $p"; exit 1; }
          done
          diff -qr TestJITLess "$V/TestJITLess"
          diff -qr ZSign "$V/ZSign"
          diff -qr litehook "$V/litehook"
          VIBE_OPENSSL="$(git -C OpenSSL rev-parse HEAD)"
          test "$VIBE_OPENSSL" = "$(git -C /tmp/vibe rev-parse "$VIBE_SHA:LiveContainer-3.8.0/OpenSSL")"
          echo "Exact Vibe signing/JIT parity proven; FlekDeck owns the LiveProcess ROM request adapter."

      # Vibe intentionally overwrites several guest/runtime files above. Every
      # Flek-specific Single switcher/PiP/viewport layer MUST be reconstructed after
      # that overlay and verified before Xcode is allowed to package an IPA.
      - name: Reapply Flek compatibility layers after Vibe overlay
        run: |
          set -euo pipefail
          python3 Tools/patch_vibecontainers_shell_compat.py
          python3 Tools/patch_vibecontainers_project_compat.py
          python3 Tools/patch_free_sidestore_support.py
          python3 Tools/patch_parallel_guest_viewport.py

      - name: Fail if Vibe overlay erased Flek UI fixes
        run: |
          set -euo pipefail
          # Home + Parallel switcher paths already verified on-device.
          grep -q 'FlekHomeSingleSwitcherGestureBridge' MultitaskSupport/MultitaskDockView.swift
          grep -q 'MultitaskSwipeZone' MultitaskSupport/MultitaskDockView.swift
          # Single-mode guest bridge reconstructed after Vibe replaces UIKit hooks.
          grep -q 'LCSingleGuestSwitcherGestureBridge' TweakLoader/UIKit+GuestHooks.m
          grep -q 'FlekSingleGuestSwitcherGestureRequested' MultitaskSupport/MultitaskDockView.swift
          # TikTok Parallel compatibility reconstructed after the same replacement.
          grep -q 'LCParallelGuestViewportBridge' TweakLoader/UIKit+GuestHooks.m
          grep -q 'LCTikTokParallelLayoutCompat' TweakLoader/UIKit+GuestHooks.m
          grep -q 'LCTikTokParallelBottomNudge' TweakLoader/UIKit+GuestHooks.m
          # Real PiP markers used by the current compatibility stack.
          grep -q 'sampleBufferDisplayLayer' LiveContainer/LCBootstrap.m
          grep -q 'com.flekdeck.nativepip.%@.%d' LiveContainer/LCBootstrap.m
          grep -q 'LCYouTubePiPRefreshSource' LiveContainer/LCBootstrap.m
          echo 'Flek switcher/TikTok/PiP layers survived Vibe overlay.'

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Build adapted FlekDeck PE client from pinned source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/emexlab/Nyxian.git /tmp/flek-pe-source
          git -C /tmp/flek-pe-source fetch --no-tags origin "$NYXIAN_PE_SHA"
          git -C /tmp/flek-pe-source checkout --detach "$NYXIAN_PE_SHA"
          test "$(git -C /tmp/flek-pe-source rev-parse HEAD)" = "$NYXIAN_PE_SHA"
          python3 Tools/prepare_flekdeck_pe_runtime.py /tmp/flek-pe-source
          mkdir -p build
          set +e
          xcodebuild build \
            -project /tmp/flek-pe-source/Nyxian.xcodeproj \
            -target LiveProcess \
            -configuration Release \
            -sdk iphoneos -arch arm64 \
            SYMROOT="$PWD/build/pe-runtime" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/pe-runtime-build.log | xcpretty
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -nE 'error:|fatal error:|Undefined symbols|duplicate symbol|ld:' build/pe-runtime-build.log | tail -150 || true
            exit "$status"
          fi
          CLIENT="$PWD/build/pe-runtime/Release-iphoneos/FlekDeckPERuntime.dylib"
          test -f "$CLIENT"
          nm -gU "$CLIENT" > build/pe-runtime-symbols.txt
          grep -q _environment_client_connect_to_host build/pe-runtime-symbols.txt
          grep -q _environment_client_connect_to_syscall_proxy build/pe-runtime-symbols.txt
          grep -q _environment_init build/pe-runtime-symbols.txt
          grep -q _ResecureDecoder build/pe-runtime-symbols.txt
          # Full Nyxian DYLD parity: the pinned guest runtime must export
          # the installer, guest image hooks, and LiveShim dlopen constructor.
          grep -q _performHookDyldApi build/pe-runtime-symbols.txt
          grep -q _DyldHooksInit build/pe-runtime-symbols.txt
          test -s "$PWD/build/pe-runtime/Release-iphoneos/LiveShim.framework/LiveShim"
          nm -gU "$PWD/build/pe-runtime/Release-iphoneos/LiveShim.framework/LiveShim" > build/pe-liveshim-symbols.txt
          grep -q _LiveShimDlopenHookInit build/pe-liveshim-symbols.txt
          ! grep -q _NSExtensionMain build/pe-runtime-symbols.txt

          # The ROM mounts these two actual Nyxian userspace services from
          # the host app bundle. A PE client alone cannot boot the ROM.
          for target in bootstrapd; do
            set +e
            xcodebuild build \
              -project /tmp/flek-pe-source/Nyxian.xcodeproj \
              -target "$target" \
              -configuration Release \
              -sdk iphoneos -arch arm64 \
              SYMROOT="$PWD/build/pe-runtime" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              2>&1 | tee "build/${target}-build.log" | xcpretty
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              grep -nE 'error:|fatal error:|Undefined symbols|duplicate symbol|ld:' "build/${target}-build.log" | tail -150 || true
              exit "$status"
            fi
            test -s "build/pe-runtime/Release-iphoneos/${target}.dylib"
          done

      # Pin an upstream Nyxian build after MobileDevelopmentService was added.
      # Nyxian 0.11.4 predates the service and cannot supply this boot runtime.
      - name: Download upstream Nyxian userspace service dependencies
        uses: actions/download-artifact@v8
        with:
          repository: emexlab/Nyxian
          run-id: 36919965048
          name: Nyxian.ipa
          github-token: ${{ github.token }}
          path: build/upstream-nyxian

      - name: Stage exact upstream Nyxian service layout
        run: |
          set -euo pipefail
          python3 - "$PWD/build/upstream-nyxian" "$PWD/build/pe-prebuilt" <<'PY'
          import os
          import pathlib
          import shutil
          import stat
          import sys
          import zipfile

          source = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          output.mkdir(parents=True, exist_ok=True)
          prefix = "Payload/Nyxian.app/Frameworks/"
          must_have = (
              "MobileDevelopmentService.dylib",
              "MobileDevelopmentKit.framework/MobileDevelopmentKit",
              "MobileDevelopmentKit.framework/Frameworks/CoreCompiler.framework/CoreCompiler",
          )
          # upload-artifact v7 archive:false stores the IPA directly.
          # download-artifact v8 retrieves that original IPA, not Payload/.
          candidates = []
          for file in source.iterdir():
              if file.is_file() and zipfile.is_zipfile(file):
                  with zipfile.ZipFile(file) as z:
                      names = set(z.namelist())
                      if all(prefix + item in names for item in must_have):
                          candidates.append(file)
          if len(candidates) != 1:
              raise SystemExit("Expected one unarchived upstream Nyxian IPA with all native compiler services")
          with zipfile.ZipFile(candidates[0]) as z:
              for info in z.infolist():
                  name = info.filename
                  if not name.startswith(prefix):
                      continue
                  relative = name[len(prefix):]
                  if not (relative == "MobileDevelopmentService.dylib" or
                          relative.startswith("MobileDevelopmentKit.framework/")):
                      continue
                  path = pathlib.PurePosixPath(relative)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe Nyxian IPA member: {name}")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Unexpected symlink in upstream userspace service: {name}")
                  target = output.joinpath(*path.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as dest:
                      shutil.copyfileobj(src, dest)
                  os.chmod(target, (mode & 0o777) or 0o644)
          for item in must_have:
              if not (output / item).is_file():
                  raise SystemExit(f"Missing verified native Nyxian binary: {item}")
          print("Validated and staged upstream Nyxian services and nested CoreCompiler")
          PY

      - name: Parse and verify compatibility boundary
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/prepare_flekdeck_pe_runtime.py
          plutil -lint LiveProcess/LiveProcess.entitlements LiveProcess/LiveProcessRelease.entitlements
          grep -q FlekDeckRunPERequest LiveProcess/main.m
          grep -q FlekDeckPrepareROMRuntime LiveProcess/main.m
          grep -q 'pe-environment-init-enter' LiveProcess/main.m
          grep -q 'pe-mach-syscall-proxy-connected' LiveProcess/main.m
          grep -q 'rom-registration-get-task-allow-denied' LiveContainerSwiftUI/Views/Bootloader/FlekROMSigning.m
          grep -q 'previous-nyxian-kmsg.log' LiveContainerSwiftUI/Views/Bootloader/FlekDeckBootloader.swift
          grep -q 'recordCommittedROM' LiveContainerSwiftUI/Views/Bootloader/FlekDeckBootloader.swift
          grep -q 'rom-committed-receipt-present-but-manifest-missing' LiveContainerSwiftUI/Views/Bootloader/FlekDeckBootloader.swift
          grep -q 'FlekShowAppCardBackgrounds' LiveContainerSwiftUI/FlekDeck/Home/FlekDeckModel.swift
          grep -q 'Show App Card Backgrounds' LiveContainerSwiftUI/FlekDeck/Settings/FlekPersonalizationView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/FlekDeck/Settings/FlekPersonalizationView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/FlekDeck/Home/FlekAppCard.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardIconCell.swift
          python3 -m py_compile Tools/patch_free_sidestore_support.py
          python3 -m py_compile Tools/patch_livecontainer_multitask_stikdebug.py
          python3 -m py_compile Tools/patch_parallel_guest_viewport_base.py
          python3 -m py_compile Tools/patch_parallel_guest_viewport.py
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          xcrun swiftc -frontend -parse MultitaskSupport/MultitaskDockView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Bootloader/FlekDeckBootloader.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Models/LCAppModel.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
          grep -q 'com.fs.flekdeck' SideStoreSupport/SideStoreHooks.m
          grep -q 'flekdeck-side-source.json' SideStoreSupport/SideStoreHooks.m
          grep -q 'stikdebug://enable-jit' LiveContainerSwiftUI/Utilities/LCUtilsExtensions.swift
          grep -q 'stikdebug://enable-jit' LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          grep -q 'bookmarkDataWithOptions' MultitaskSupport/AppSceneViewController.m
          grep -q 'LCParallelGuestViewportBridge' TweakLoader/UIKit+GuestHooks.m
          grep -q 'lc_parallelGuest_bounds' TweakLoader/UIKit+GuestHooks.m
          grep -q 'LCSingleGuestSwitcherGestureBridge' TweakLoader/UIKit+GuestHooks.m
          grep -q 'FlekSingleGuestSwitcherGestureRequested' MultitaskSupport/MultitaskDockView.swift
          grep -q 'LCTikTokParallelBottomNudge' TweakLoader/UIKit+GuestHooks.m
          grep -q 'sampleBufferDisplayLayer' LiveContainer/LCBootstrap.m
          grep -q 'LCYouTubePiPRefreshSource' LiveContainer/LCBootstrap.m
          ! grep -q 'FlekHostHasDevelopmentSigning' LiveContainerSwiftUI/Models/LCAppModel.swift
          ! grep -q 'FlekHostDevelopmentSigningError' LiveContainerSwiftUI/Models/LCAppModel.swift
          ! grep -q 'FlekDeck host does not have get-task-allow' LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
          grep -q 'LCUtils.validateJITLessSetup' LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
          grep -q 'LCSharedUtils.launchToGuestApp' LiveContainerSwiftUI/Models/LCAppModel.swift
          test "$(git hash-object LiveContainerSwiftUI/Models/LCAppModel.swift)" = "$(git -C /tmp/vibe rev-parse "$VIBE_SHA:LiveContainer-3.8.0/LiveContainerSwiftUI/Models/LCAppModel.swift")"
          test "$(git hash-object LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift)" = "$(git -C /tmp/vibe rev-parse "$VIBE_SHA:LiveContainer-3.8.0/LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift")"

      - name: Build unsigned real-device archive
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck-VibeCore.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | xcpretty
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- compiler/linker errors ---'
            grep -nE '(^| )error:|fatal error:|Undefined symbols|duplicate symbol|ld:' build/xcodebuild.log | tail -250 || true
            exit "$status"
          fi

      - name: Install ldid
        run: |
          set -euo pipefail
          brew install ldid

      - name: Package signer-compatible IPA
        run: |
          set -euo pipefail
          APP="$(find "$PWD/build/FlekDeck-VibeCore.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          test "$BUNDLE_ID" = "com.fs.flekdeck"
          /usr/libexec/PlistBuddy -c 'Delete :ALTAppGroups' "$APP/Info.plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :ALTAppGroups array' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :ALTAppGroups:0 string group.com.SideStore.SideStore' "$APP/Info.plist"
          cp entitlements.xml build/FlekDeck-SideStore.entitlements
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/FlekDeck-SideStore.entitlements')
          s = p.read_text()
          replacements = {
              '$(DEVELOPMENT_TEAM)': 'AAAAA11111',
              '$(PRODUCT_BUNDLE_IDENTIFIER)': 'com.fs.flekdeck',
              '$(APP_GROUP_SIDESTORE)': 'group.com.SideStore.SideStore',
              '$(APP_GROUP_ALTSTORE)': 'group.com.rileytestut.AltStore',
              '$(AppIdentifierPrefix)': 'AAAAA11111.',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          if '$(' in s:
              raise SystemExit('unresolved entitlement build variable remains')
          p.write_text(s)
          PY
          plutil -lint build/FlekDeck-SideStore.entitlements
          ldid -S"$PWD/build/FlekDeck-SideStore.entitlements" "$APP/$EXECUTABLE"
          ldid -e "$APP/$EXECUTABLE" > "$PWD/build/FlekDeck-host-entitlements.plist"
          plutil -lint "$PWD/build/FlekDeck-host-entitlements.plist"
          # The ROM ZIP installer must be able to load ZSign directly. A
          # successful host build is insufficient if the signer is omitted.
          test -s "$APP/Frameworks/ZSign.dylib"
          test -s "$APP/Frameworks/OpenSSL.framework/OpenSSL"
          nm -gU "$APP/Frameworks/ZSign.dylib" > build/FlekDeck-ZSign-symbols.txt
          grep -Fq 'OBJC_CLASS_$_ZSigner' build/FlekDeck-ZSign-symbols.txt
          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$PWD/build/FlekDeck-host-entitlements.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$PWD/build/FlekDeck-host-entitlements.plist")" = "AAAAA11111.com.fs.flekdeck"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ALTAppGroups:0' "$APP/Info.plist")" = "group.com.SideStore.SideStore"
          EXTENSION="$APP/PlugIns/LiveProcess.appex"
          test -d "$EXTENSION"
          PE_PRODUCTS="$PWD/build/pe-runtime/Release-iphoneos"
          PE_PREBUILT="$PWD/build/pe-prebuilt"
          mkdir -p "$EXTENSION/Frameworks"
          cp "$PE_PRODUCTS/FlekDeckPERuntime.dylib" "$EXTENSION/Frameworks/"
          cp -R "$PE_PRODUCTS/LiveShim.framework" "$EXTENSION/Frameworks/"
          cp "$PE_PRODUCTS/libBroadpatch.dylib" "$EXTENSION/Frameworks/"

          # NXBootstrap uses Bundle.main/Shared/{lib,include,swift}.zip and
          # the kernel mounts Shared/{kernel,LaunchServices} plus these two
          # services. Preserve the entire Shared tree at this exact pinned
          # Nyxian revision; generating only a ROM splash is not sufficient.
          NYXIAN_SOURCE="/tmp/flek-pe-source"
          test -s "$NYXIAN_SOURCE/Shared/lib.zip"
          test -s "$NYXIAN_SOURCE/Shared/include.zip"
          test -s "$NYXIAN_SOURCE/Shared/swift.zip"
          for archive in lib.zip include.zip swift.zip; do
            unzip -tq "$NYXIAN_SOURCE/Shared/$archive" > /dev/null
          done
          mkdir -p "$NYXIAN_SOURCE/Shared/kernel"
          rsync -am --include='*/' --include='*.h' --exclude='*' "$NYXIAN_SOURCE/Nyxian/" "$NYXIAN_SOURCE/Shared/kernel/"
          rsync -am --include='*/' --include='*.h' --exclude='*' "$NYXIAN_SOURCE/LiveProcess/" "$NYXIAN_SOURCE/Shared/kernel/"
          cp "$NYXIAN_SOURCE/ksurface_abi.h" "$NYXIAN_SOURCE/Shared/kernel/ksurface_abi.h"
          test -s "$NYXIAN_SOURCE/Shared/kernel/ksurface_abi.h"
          cp -R "$NYXIAN_SOURCE/Shared" "$APP/Shared"
          mkdir -p "$APP/Frameworks"
          cp "$PE_PRODUCTS/bootstrapd.dylib" "$APP/Frameworks/bootstrapd.dylib"
          cp "$PE_PRODUCTS/libBroadpatch.dylib" "$APP/Frameworks/libBroadpatch.dylib"
          cp "$PE_PREBUILT/MobileDevelopmentService.dylib" "$APP/Frameworks/MobileDevelopmentService.dylib"
          cp -R "$PE_PREBUILT/MobileDevelopmentKit.framework" "$APP/Frameworks/"
          ldid -S "$APP/Frameworks/bootstrapd.dylib"
          ldid -S "$APP/Frameworks/libBroadpatch.dylib"
          ldid -S "$APP/Frameworks/MobileDevelopmentService.dylib"
          ldid -S "$APP/Frameworks/MobileDevelopmentKit.framework/Frameworks/CoreCompiler.framework/CoreCompiler"
          find "$APP/Frameworks/MobileDevelopmentKit.framework/Frameworks/CoreCompiler.framework/Frameworks" -type f -name "*.dylib" -print0 | while IFS= read -r -d '' library; do
            ldid -S "$library"
          done
          ldid -S "$APP/Frameworks/MobileDevelopmentKit.framework/MobileDevelopmentKit"
          for required in \
            Shared/lib.zip Shared/include.zip Shared/swift.zip \
            Shared/kernel/ksurface_abi.h \
            Shared/LaunchServices/org.emexlabs.bootstrapd.plist \
            Shared/LaunchServices/org.emexlabs.compilerd.plist \
            Frameworks/bootstrapd.dylib Frameworks/MobileDevelopmentService.dylib Frameworks/libBroadpatch.dylib \
            Frameworks/MobileDevelopmentKit.framework/Frameworks/CoreCompiler.framework/CoreCompiler \
            Frameworks/MobileDevelopmentKit.framework/MobileDevelopmentKit; do
            test -s "$APP/$required" || { echo "Missing Nyxian runtime asset: $required"; exit 1; }
          done
          du -sh "$APP/Shared" "$APP/Frameworks/bootstrapd.dylib" "$APP/Frameworks/MobileDevelopmentService.dylib"
          cp ThirdParty/FlekDeckPERuntime-NOTICE.md "$APP/PE-Runtime-NOTICE.md"
          ldid -S "$EXTENSION/Frameworks/FlekDeckPERuntime.dylib"
          ldid -S "$EXTENSION/Frameworks/LiveShim.framework/LiveShim"
          ldid -S "$EXTENSION/Frameworks/libBroadpatch.dylib"
          EXT_EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$EXTENSION/Info.plist")"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          source = Path('LiveProcess/LiveProcessRelease.entitlements').read_text()
          replacements = {
              '$(APP_GROUP_SIDESTORE)': 'group.com.SideStore.SideStore',
              '$(APP_GROUP_ALTSTORE)': 'group.com.rileytestut.AltStore',
              '$(AppIdentifierPrefix)': 'AAAAA11111.',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          if '$(' in source:
              raise SystemExit('unresolved LiveProcess entitlement variable remains')
          entitlements = plistlib.loads(source.encode())
          entitlements['application-identifier'] = 'AAAAA11111.com.fs.flekdeck.LiveProcess'
          Path('build/FlekDeck-LiveProcess.entitlements').write_bytes(plistlib.dumps(entitlements))
          PY
          plutil -lint build/FlekDeck-LiveProcess.entitlements
          ldid -S"$PWD/build/FlekDeck-LiveProcess.entitlements" "$EXTENSION/$EXT_EXECUTABLE"
          ldid -e "$EXTENSION/$EXT_EXECUTABLE" > build/FlekDeck-LiveProcess-signed-entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' build/FlekDeck-LiveProcess-signed-entitlements.plist)" = 'group.com.SideStore.SideStore'
          # Nyxian checks PKHostPlugIn's installed entitlement dictionary, not
          # a source plist. Verify the packaged extension before delivering it.
          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' build/FlekDeck-LiveProcess-signed-entitlements.plist)" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' build/FlekDeck-LiveProcess-signed-entitlements.plist)" = 'AAAAA11111.com.fs.flekdeck.LiveProcess'
          test "$(plutil -extract CFBundleIdentifier raw "$EXTENSION/Info.plist")" = 'com.fs.flekdeck.LiveProcess'
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$EXTENSION/Info.plist")" = 'com.apple.ar.viewer'
          test "$(plutil -extract NSExtension.NSExtensionPrincipalClass raw "$EXTENSION/Info.plist")" = 'LiveProcessHandler'
          echo "Packaged Nyxian-compatible extension identity, entry point and signed entitlements verified."
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          # Package the unsigned app as a portable IPA. Do not include macOS
          # UID/GID, timestamp, Finder, or other ZIP extra fields: iOS installd
          # extracts the *resigned* archive on the device, and SideStore's
          # repackager must not inherit host-only ZIP metadata.
          rm -f FlekDeck.ipa
          COPYFILE_DISABLE=1 zip -qrX FlekDeck.ipa Payload
          unzip -tq FlekDeck.ipa >/dev/null
          python3 - <<'PY'
          import plistlib
          import stat
          import zipfile
          with zipfile.ZipFile('FlekDeck.ipa') as ipa:
              names = ipa.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate IPA ZIP entries')
              if not names or not all(name.startswith('Payload/') for name in names):
                  raise SystemExit('Unexpected top-level IPA ZIP layout')
              if 'Payload/FlekDeck.app/Info.plist' not in names:
                  raise SystemExit('Missing app Info.plist')
              info = plistlib.loads(ipa.read('Payload/FlekDeck.app/Info.plist'))
              if info.get('CFBundleExecutable') != 'FlekDeck':
                  raise SystemExit('Unexpected main executable')
              for member in ipa.infolist():
                  if member.filename.startswith('/') or '..' in member.filename.split('/'):
                      raise SystemExit('Unsafe IPA member: ' + member.filename)
                  if stat.S_ISLNK(member.external_attr >> 16):
                      raise SystemExit('IPA contains symlink: ' + member.filename)
                  if member.extra:
                      raise SystemExit('Nonportable ZIP extra field in ' + member.filename)
              if ipa.testzip() is not None:
                  raise SystemExit('Damaged IPA entry')
              print(f'Canonical SideStore IPA validated: {len(names)} entries, no ZIP extras or symlinks')
          PY
          unzip -Z1 FlekDeck.ipa > FlekDeck-ipa-entries.txt
          for required in \
            Shared/lib.zip Shared/include.zip Shared/swift.zip \
            Shared/kernel/ksurface_abi.h \
            Shared/LaunchServices/org.emexlabs.bootstrapd.plist \
            Shared/LaunchServices/org.emexlabs.compilerd.plist \
            Frameworks/bootstrapd.dylib Frameworks/MobileDevelopmentService.dylib Frameworks/libBroadpatch.dylib \
            Frameworks/MobileDevelopmentKit.framework/Frameworks/CoreCompiler.framework/CoreCompiler \
            Frameworks/MobileDevelopmentKit.framework/MobileDevelopmentKit; do
            grep -Fxq "Payload/FlekDeck.app/$required" FlekDeck-ipa-entries.txt || { echo "IPA missing Nyxian runtime asset: $required"; exit 1; }
          done
          shasum -a 256 FlekDeck.ipa | tee FlekDeck.sha256
          ls -lh FlekDeck.ipa FlekDeck.sha256 FlekDeck-host-entitlements.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-ipa
          path: |
            build/FlekDeck.ipa
            build/FlekDeck.sha256
            build/FlekDeck-host-entitlements.plist
            build/FlekDeck-LiveProcess-signed-entitlements.plist
            build/pe-runtime-symbols.txt
            build/pe-liveshim-symbols.txt
          if-no-files-found: error

