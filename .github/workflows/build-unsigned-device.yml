name: Unsigned Real Device IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Strip remaining FlekSt0re access and payment remnants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Xcode's synchronized group retained one deleted file in
          # membershipExceptions, which makes an otherwise-clean source tree fail
          # before Swift compilation.
          project = Path('LiveContainer.xcodeproj/project.pbxproj')
          ptext = project.read_text(encoding='utf-8')
          stale_project_entries = [
              'FlekStore/Models/DeviceStatusResponse.swift',
              'FlekStore/Models/AccessVerification.swift',
              'FlekStore/Screens/Premium/PremiumRequiredView.swift',
              'FlekStore/Views/AccessBlockedView.swift',
          ]
          for item in stale_project_entries:
              ptext = ptext.replace(f'\t\t\t\t{item},\n', '')
              ptext = ptext.replace(f'\t\t\t\t"{item}",\n', '')
          project.write_text(ptext, encoding='utf-8')

          # Settings still contained the old FlekSt0re subscription panel and
          # /device-service/get-status client. Remove the feature, not merely the
          # missing response type.
          settings = Path('LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift')
          s = settings.read_text(encoding='utf-8')

          if '@State private var udid: String = ""' in s:
              s, n = re.subn(
                  r'    @State private var udid: String = ""\n\s*\n'
                  r'    @State private var subscriptionEndDate: String\?\n'
                  r'    @State private var hasSubscription: Bool = false\n'
                  r'    @State private var isSubscriptionLoading: Bool = false\n\s*\n',
                  '', s, count=1
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription state')

          s = s.replace('    @AppStorage("FSDeviceUDID") private var fsDeviceUDID: String = ""\n', '')

          if '///Flekstore user defaults' in s:
              s, n = re.subn(
                  r'    ///Flekstore user defaults\n'
                  r'    @AppStorage\("FSEncryptedUDID"\).*?'
                  r'    private var subscriptionInitialized: Bool = false\n\s*\n',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove FlekSt0re subscription storage')

          if 'private static let subscriptionDateFormatter' in s:
              s, n = re.subn(
                  r'    private static let subscriptionDateFormatter: DateFormatter = \{.*?    \}\(\)\n\s*\n',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription date formatter')

          if 'private func formattedSubscriptionDate' in s:
              s, n = re.subn(
                  r'    private func formattedSubscriptionDate\(_ dateString: String\) -> String \{.*?    \}\n\s*\n',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription date helper')

          if '// MARK: - UDID' in s:
              s, n = re.subn(
                  r'    // MARK: - UDID\n.*?(?=    /// Name of the step the haptics slider)',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription UDID helpers')

          if 'Image(systemName: "wallet.pass.fill")' in s:
              s, n = re.subn(
                  r'                    HStack\(spacing: 12\) \{\n'
                  r'                        Image\(systemName: "wallet\.pass\.fill"\).*?'
                  r'                    \.padding\(\.vertical, 6\)\n',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove FlekSt0re UDID settings row')

          if '// MARK: - Subscription Status' in s:
              s, n = re.subn(
                  r'\n                    // MARK: - Subscription Status\n'
                  r'                    HStack\(spacing: 12\) \{.*?'
                  r'                    \.padding\(\.vertical, 6\)\n',
                  '\n', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove premium subscription settings row')

          bootstrap = '''            .onAppear {
                loadEncryptedUDIDFromPlist()
                hydrateSubscriptionStateFromStorage()

                // Fetch once for initial subscription bootstrap only.
                if !subscriptionInitialized {
                    Task {
                        await checkSubscription()
                        subscriptionInitialized = true
                    }
                }
            }
            .onChange(of: deviceUDID) { newValue in
                udid = newValue
            }
            .onChange(of: subscriptionStatusStored) { newValue in
                hasSubscription = newValue
            }
            .onChange(of: subscriptionEndDateStored) { newValue in
                subscriptionEndDate = newValue.isEmpty ? nil : newValue
            }
'''
          s = s.replace(bootstrap, '')

          # These three functions are the final methods in LCSettingsView and exist
          # only for the removed access/subscription service.
          tail_marker = '\n    private func loadEncryptedUDIDFromPlist() {'
          if tail_marker in s:
              s = s[:s.index(tail_marker)] + '\n}\n'

          settings.write_text(s, encoding='utf-8')

          forbidden = [
              'DeviceStatusResponse',
              'PremiumRequiredView',
              'Premium Subscription',
              'FSSubscriptionStatus',
              'FSSubscriptionEndDate',
              'FSSubscriptionInitialized',
              'FSEncryptedUDID',
              'device-service/get-status',
              'Unable to verify access',
              'User UDID is empty',
              'checkSubscription()',
              'hasSubscription',
          ]
          roots = [Path('LiveContainerSwiftUI'), Path('LiveContainer.xcodeproj/project.pbxproj')]
          violations = []
          for root in roots:
              files = [root] if root.is_file() else list(root.rglob('*'))
              for f in files:
                  if not f.is_file() or f.suffix not in {'.swift', '.pbxproj'}:
                      continue
                  text = f.read_text(encoding='utf-8', errors='ignore')
                  for token in forbidden:
                      if token in text:
                          violations.append(f'{f}: {token}')
          if violations:
              raise SystemExit('FlekSt0re payment/access remnants remain:\n' + '\n'.join(violations))

          print('FlekDeck payment/access cleanup audit passed')
          PY

      - name: Persist standalone cleanup
        run: |
          set -euo pipefail
          if git diff --quiet -- LiveContainer.xcodeproj/project.pbxproj LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift; then
            echo 'Standalone source already clean'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LiveContainer.xcodeproj/project.pbxproj LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          git commit -m 'Remove remaining FlekSt0re payment settings'
          git push origin HEAD:main

      - name: Build unsigned real-device archive
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Validate device product and package IPA
        run: |
          set -euo pipefail
          APP="$(find "$PWD/build/FlekDeck.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          /usr/bin/file "$APP/$EXECUTABLE"
          plutil -p "$APP/Info.plist" | head -100

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry FlekDeck-unsigned-device.ipa Payload
          test -s FlekDeck-unsigned-device.ipa
          unzip -t FlekDeck-unsigned-device.ipa >/dev/null
          ls -lh FlekDeck-unsigned-device.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-unsigned-device-ipa
          path: build/FlekDeck-unsigned-device.ipa
          if-no-files-found: error
