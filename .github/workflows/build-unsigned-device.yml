name: Unsigned Real Device IPA

# Legacy build: main uses build-unsigned-ipa.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Strip remaining FlekSt0re access and payment remnants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path('LiveContainer.xcodeproj/project.pbxproj')
          ptext = project.read_text(encoding='utf-8')
          stale_project_entries = [
              'FlekStore/Models/DeviceStatusResponse.swift',
              'FlekStore/Models/AccessVerification.swift',
              'FlekStore/Screens/Premium/PremiumRequiredView.swift',
              'FlekStore/Views/AccessBlockedView.swift',
          ]
          for item in stale_project_entries:
              ptext = ptext.replace(f'\t\t\t\t{item},\n', '')
              ptext = ptext.replace(f'\t\t\t\t"{item}",\n', '')
          project.write_text(ptext, encoding='utf-8')

          settings = Path('LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift')
          s = settings.read_text(encoding='utf-8')

          # Repair the partial formattedSubscriptionDate removal produced by the
          # previous cleanup revision. This is intentionally exact and idempotent.
          s, repaired = re.subn(
              r'\n        if let dateOnly = dateString\.split\(separator: " "\)\.first \{\n'
              r'            return String\(dateOnly\)\n'
              r'        \}\n\n'
              r'        return dateString\n'
              r'    \}\n',
              '\n', s, count=1
          )
          if repaired:
              print('Repaired orphaned formattedSubscriptionDate tail')

          if '@State private var udid: String = ""' in s:
              s, n = re.subn(
                  r'    @State private var udid: String = ""\n\s*\n'
                  r'    @State private var subscriptionEndDate: String\?\n'
                  r'    @State private var hasSubscription: Bool = false\n'
                  r'    @State private var isSubscriptionLoading: Bool = false\n\s*\n',
                  '', s, count=1
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription state')

          s = s.replace('    @AppStorage("FSDeviceUDID") private var fsDeviceUDID: String = ""\n', '')

          if '///Flekstore user defaults' in s:
              s, n = re.subn(
                  r'    ///Flekstore user defaults\n'
                  r'    @AppStorage\("FSEncryptedUDID"\).*?'
                  r'    private var subscriptionInitialized: Bool = false\n\s*\n',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove FlekSt0re subscription storage')

          if 'private static let subscriptionDateFormatter' in s:
              s, n = re.subn(
                  r'    private static let subscriptionDateFormatter: DateFormatter = \{.*?    \}\(\)\n\s*\n',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription date formatter')

          if 'private func formattedSubscriptionDate' in s:
              s, n = re.subn(
                  r'    private func formattedSubscriptionDate\(_ dateString: String\) -> String \{.*?'
                  r'(?=    // MARK: - UDID)',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription date helper')

          if '// MARK: - UDID' in s:
              s, n = re.subn(
                  r'    // MARK: - UDID\n.*?(?=    /// Name of the step the haptics slider)',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription UDID helpers')

          if 'Image(systemName: "wallet.pass.fill")' in s:
              s, n = re.subn(
                  r'                    HStack\(spacing: 12\) \{\n'
                  r'                        Image\(systemName: "wallet\.pass\.fill"\).*?'
                  r'                    \.padding\(\.vertical, 6\)\n',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove FlekSt0re UDID settings row')

          if '// MARK: - Subscription Status' in s:
              s, n = re.subn(
                  r'\n                    // MARK: - Subscription Status\n'
                  r'                    HStack\(spacing: 12\) \{.*?'
                  r'                    \.padding\(\.vertical, 6\)\n',
                  '\n', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove premium subscription settings row')

          if 'loadEncryptedUDIDFromPlist()' in s:
              s, n = re.subn(
                  r'            \.onAppear \{\n'
                  r'                loadEncryptedUDIDFromPlist\(\).*?'
                  r'            \.onChange\(of: subscriptionEndDateStored\) \{ newValue in\n'
                  r'                subscriptionEndDate = newValue\.isEmpty \? nil : newValue\n'
                  r'            \}\n',
                  '', s, count=1, flags=re.S
              )
              if n != 1:
                  raise SystemExit('Could not remove subscription lifecycle hooks')

          # Certificate ownership fix: never silently import FlekSt0re's embedded
          # identity. Keep the LiveContainer/SideStore PKCS#12 picker as the user-
          # controlled path, and allow it to replace existing persisted cert state.
          s = s.replace(
              '                if sharedModel.multiLCStatus != 2 && !certificateDataFound {\n',
              '                if sharedModel.multiLCStatus != 2 {\n',
              1
          )
          s = s.replace(
              '                        Button("Import Flekstore certificate") {\n'
              '                            Task { await importEmbeddedCertificate() }\n'
              '                        }\n'
              '                        \n',
              ''
          )
          s = s.replace(
              '        .onAppear {\n'
              '            if !certificateDataFound {\n'
              '                Task { await importEmbeddedCertificate() }\n'
              '            }\n',
              '        .onAppear {\n'
          )

          # The file importer must stay SideStore/LiveContainer-compatible PKCS#12.
          if '.betterFileImporter(isPresented: $certificateImportFileAlert.show, types: [.p12]' not in s:
              raise SystemExit('PKCS#12 (.p12) certificate picker is missing')

          # Remove the separate Settings beta warning card as well as the overlay.
          s, beta_cards = re.subn(
              r'\n                if isBetaiOS \{\n'
              r'                    Section \{.*?'
              r'                    \}\n'
              r'                \}\n',
              '\n', s, count=1, flags=re.S
          )
          if beta_cards:
              print('Removed Settings beta warning card')

          tail_marker = '\n    private func loadEncryptedUDIDFromPlist() {'
          if tail_marker in s:
              s = s[:s.index(tail_marker)] + '\n}\n'

          settings.write_text(s, encoding='utf-8')

          # The always-on beta badge is managed separately by LCTabView. Force it
          # hidden regardless of stale LC app-group preferences from older builds.
          tab = Path('LiveContainerSwiftUI/Views/LCTabView.swift')
          t = tab.read_text(encoding='utf-8')
          t = t.replace(
              '@AppStorage("LCBetaBannerOverride", store: LCUtils.appGroupUserDefault) private var betaBannerOverride: Int = 0',
              '@AppStorage("LCBetaBannerOverride", store: LCUtils.appGroupUserDefault) private var betaBannerOverride: Int = 2'
          )
          t, overlay_replacements = re.subn(
              r'    private func updateBetaOverlay\(\) \{\n'
              r'        let shouldShow: Bool\n'
              r'        switch betaBannerOverride \{.*?'
              r'        \}\n'
              r'    \}\n',
              '    private func updateBetaOverlay() {\n'
              '        if sceneDelegate.window?.windowScene != nil {\n'
              '            BetaOverlayManager.shared.hide()\n'
              '        }\n'
              '    }\n',
              t, count=1, flags=re.S
          )
          if overlay_replacements != 1 and 'BetaOverlayManager.shared.hide()' not in t:
              raise SystemExit('Could not force beta overlay off')
          tab.write_text(t, encoding='utf-8')

          forbidden = [
              'DeviceStatusResponse',
              'PremiumRequiredView',
              'Premium Subscription',
              'FSSubscriptionStatus',
              'FSSubscriptionEndDate',
              'FSSubscriptionInitialized',
              'FSEncryptedUDID',
              'device-service/get-status',
              'Unable to verify access',
              'User UDID is empty',
              'checkSubscription()',
              'hasSubscription',
              'dateOnly = dateString.split',
          ]
          roots = [Path('LiveContainerSwiftUI'), Path('LiveContainer.xcodeproj/project.pbxproj')]
          violations = []
          for root in roots:
              files = [root] if root.is_file() else list(root.rglob('*'))
              for f in files:
                  if not f.is_file() or f.suffix not in {'.swift', '.pbxproj'}:
                      continue
                  text = f.read_text(encoding='utf-8', errors='ignore')
                  for token in forbidden:
                      if token in text:
                          violations.append(f'{f}: {token}')
          if violations:
              raise SystemExit('FlekSt0re payment/access remnants remain: ' + '; '.join(violations))

          print('FlekDeck payment/access cleanup + beta/certificate audit passed')
          PY

      - name: Parse cleaned Swift sources
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/LCTabView.swift

      - name: Persist standalone cleanup
        run: |
          set -euo pipefail
          if git diff --quiet -- LiveContainer.xcodeproj/project.pbxproj LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift LiveContainerSwiftUI/Views/LCTabView.swift; then
            echo 'Standalone source already clean'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LiveContainer.xcodeproj/project.pbxproj LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift LiveContainerSwiftUI/Views/LCTabView.swift
          git commit -m 'Fix beta warning and certificate import flow'
          git push origin HEAD:main

      - name: Build unsigned real-device archive
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Validate device product and package IPA
        run: |
          set -euo pipefail
          APP="$(find "$PWD/build/FlekDeck.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          /usr/bin/file "$APP/$EXECUTABLE"
          plutil -p "$APP/Info.plist" | head -100

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry FlekDeck-unsigned-device.ipa Payload
          test -s FlekDeck-unsigned-device.ipa
          unzip -t FlekDeck-unsigned-device.ipa >/dev/null
          ls -lh FlekDeck-unsigned-device.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-unsigned-device-ipa
          path: build/FlekDeck-unsigned-device.ipa
          if-no-files-found: error
