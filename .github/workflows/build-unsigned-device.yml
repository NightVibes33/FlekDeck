name: Unsigned Real Device IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Repair stale FlekSt0re Xcode project references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path('LiveContainer.xcodeproj/project.pbxproj')
          text = project.read_text(encoding='utf-8')
          original = text

          stale = [
              'FlekStore/Models/DeviceStatusResponse.swift',
              'FlekStore/Models/AccessVerification.swift',
              'FlekStore/Screens/Premium/PremiumRequiredView.swift',
              'FlekStore/Views/AccessBlockedView.swift',
          ]

          for item in stale:
              text = text.replace(f'\t\t\t\t{item},\n', '')
              text = text.replace(f'\t\t\t\t"{item}",\n', '')

          project.write_text(text, encoding='utf-8')

          leftovers = [item for item in stale if item in text]
          if leftovers:
              raise SystemExit('Stale Xcode references remain: ' + ', '.join(leftovers))

          removed = sum(original.count(item) for item in stale)
          print(f'Removed {removed} stale FlekSt0re project reference(s)')
          PY

      - name: Persist Xcode project repair
        run: |
          set -euo pipefail
          if git diff --quiet -- LiveContainer.xcodeproj/project.pbxproj; then
            echo 'Xcode project already clean'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LiveContainer.xcodeproj/project.pbxproj
          git commit -m 'Remove stale FlekSt0re Xcode project references'
          git push origin HEAD:main

      - name: Build unsigned real-device archive
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Validate device product and package IPA
        run: |
          set -euo pipefail
          APP="$(find "$PWD/build/FlekDeck.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          /usr/bin/file "$APP/$EXECUTABLE"
          plutil -p "$APP/Info.plist" | head -100

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry FlekDeck-unsigned-device.ipa Payload
          test -s FlekDeck-unsigned-device.ipa
          unzip -t FlekDeck-unsigned-device.ipa >/dev/null
          ls -lh FlekDeck-unsigned-device.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-unsigned-device-ipa
          path: build/FlekDeck-unsigned-device.ipa
          if-no-files-found: error
