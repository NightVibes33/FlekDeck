name: Fix temp Parallel runner and dispatch IPA

on:
  push:
    branches:
      - experiment/parallel-guest-layout-safearea
    paths:
      - '.github/trigger-fix-parallel-runner'

permissions:
  contents: write
  actions: write

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/parallel-guest-layout-safearea
          fetch-depth: 1

      - name: Remove undefined legacy gesture bridge injection from temp build patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tools/patch_multitask_jit_diagnosis.py')
          s = p.read_text()
          old = 'FlekGuestBottomGestureBridge.shared.install(on: keyWindow)'
          new = '// Temp Parallel layout build: keep the base control path unchanged.'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 bridge references in patch script, found {count}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          grep -q 'Temp Parallel layout build: keep the base control path unchanged' Tools/patch_multitask_jit_diagnosis.py

      - name: Commit runner-only temp branch correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Tools/patch_multitask_jit_diagnosis.py
          git commit -m 'Stop temp IPA build from injecting undefined gesture bridge'
          git push origin HEAD:experiment/parallel-guest-layout-safearea

      - name: Dispatch signer-compatible IPA build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-unsigned-ipa.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref experiment/parallel-guest-layout-safearea
