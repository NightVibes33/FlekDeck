name: FlekDeck Temp 32-bit IPA

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [temp/32bit-liveexec-data-folder]
    paths:
      - '.github/workflows/build-flekdeck-sidestore-parity-temp.yml'
      - 'LiveContainer.xcodeproj/**'
      - 'LiveContainer/**'
      - 'LiveContainerSwiftUI/**'
      - 'LiveProcess/**'
      - 'MultitaskSupport/**'
      - 'SideStoreSupport/**'
      - 'TweakLoader/**'
      - 'Resources/**'
      - 'entitlements.xml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LIVEEXEC_RUNTIME_URL: https://github.com/NightVibes33/livecontainer-32bit-unsigned-ipa/releases/download/liveexec32-r89/LiveExec32-r89.zip
      LIVEEXEC_RUNTIME_SHA256: 9d35d8d6d4c9c5188e6a53e797de307e6aab579ab43b8fdbb05c8e1b5e8cf7c2
      LIVEEXEC_LOAD_PATH: Frameworks/LiveExec32Shared.framework/LiveExec32Shared

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Validate checked-in main and LiveExec32 boundaries
        run: |
          set -euxo pipefail
          git fetch --no-tags origin main

          # Parallel/LiveProcess host implementation must be the exact proven main source.
          protected=(
            MultitaskSupport/MultitaskDockView.swift
            MultitaskSupport/DecoratedAppSceneViewController.m
            MultitaskSupport/MultitaskAppWindow.swift
            LiveContainerSwiftUI/Utilities/LCUtils.m
          )
          for p in "${protected[@]}"; do
            test "$(git hash-object "$p")" = "$(git rev-parse origin/main:"$p")"
          done

          # ARM32 is the only intentional execution delta from main.
          grep -Fq 'static int (*appMain)(int, char**);' LiveContainer/LCBootstrap.m
          grep -Fq 'bool is32bit = false;' LiveContainer/LCBootstrap.m
          grep -Fq 'if(!is32bit) {' LiveContainer/LCBootstrap.m
          grep -Fq 'int (*emulatorMain)(int, char **, char **) = NULL;' LiveContainer/LCBootstrap.m
          grep -Fq 'dlsym(appHandle, emulatorEntrySymbol.UTF8String)' LiveContainer/LCBootstrap.m
          grep -Fq 'ret = emulatorMain(sizeof(argv32)/sizeof(*argv32) - 1, argv32, environ);' LiveContainer/LCBootstrap.m
          grep -Fq 'LCSelected32BitEmulator' LiveContainer/LCBootstrap.m
          grep -Fq 'LC32BitEmulatorLoadPath' LiveContainer/LCBootstrap.m
          grep -Fq 'LC32BitEmulatorEntrySymbol' LiveContainer/LCBootstrap.m
          grep -Fq 'self.isJITNeeded = YES;' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -Fq 'self.classicMode = YES;' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -Fq 'self.spoofSDKVersion = YES;' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -Fq 'appInfo.is32bit ? false' LiveContainerSwiftUI/Models/LCAppModel.swift
          grep -Fq 'appInfo.is32bit ? appInfo.defaultClassicMode : 0' LiveContainerSwiftUI/Models/LCAppModel.swift
          grep -Fq 'launchToGuestAppWithClassicMode' LiveContainer/LCSharedUtils.h
          grep -Fq 'launchToGuestApp(withClassicMode: classicMode)' LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          grep -Fq 'is32BitSupported=1' LiveContainer.xcodeproj/project.pbxproj

          # Build directly from checked-in source. Nothing may mutate it here.
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Models/LCAppModel.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/LCTabView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          git diff --exit-code

      - name: Build unsigned Release archive
        run: |
          set -uo pipefail
          mkdir -p build
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck-32bit-temp.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | xcpretty
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE '(^| )error:|fatal error:|Undefined symbols|duplicate symbol|ld:' build/xcodebuild.log | tail -300 || true
            echo '--- raw xcodebuild tail ---'
            tail -400 build/xcodebuild.log || true
            exit "$status"
          fi

      - name: Embed verified LiveExec32 r89
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/LiveExec32-r89.zip"
          curl --fail --location --retry 3 --retry-all-errors -o "$ZIP" "$LIVEEXEC_RUNTIME_URL"
          echo "$LIVEEXEC_RUNTIME_SHA256  $ZIP" | shasum -a 256 -c -
          rm -rf build/liveexec-source
          mkdir -p build/liveexec-source
          unzip -q "$ZIP" -d build/liveexec-source
          EMU="$(find build/liveexec-source -maxdepth 2 -type d -name LiveExec32.app -print -quit)"
          APP="$(find build/FlekDeck-32bit-temp.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$EMU"; test -n "$APP"
          test -f "$EMU/$LIVEEXEC_LOAD_PATH"
          test -d "$EMU/RootFS"
          test -f "$EMU/RootFS/usr/lib/libstdc++.6.dylib"
          test -f "$EMU/RootFS/usr/lib/libiconv.2.dylib"
          test -f "$EMU/RootFS/usr/lib/libcharset.1.dylib"
          test -s Resources/universal.js
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitTranslationLayer' "$EMU/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledBuildRevision' "$EMU/Info.plist")" = 89
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorLoadPath' "$EMU/Info.plist")" = "$LIVEEXEC_LOAD_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorEntrySymbol' "$EMU/Info.plist")" = LC32RunGuest
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" > "$RUNNER_TEMP/liveexec32.symbols"
          grep -q '_LC32RunGuest' "$RUNNER_TEMP/liveexec32.symbols"
          rm -rf "$APP/LiveExec32.app"
          ditto "$EMU" "$APP/LiveExec32.app"
          ditto Resources/universal.js "$APP/universal.js"

      - name: Install ldid
        run: brew install ldid

      - name: Apply FlekDeck packaging contract
        run: |
          set -euxo pipefail
          APP="$(find "$PWD/build/FlekDeck-32bit-temp.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          DISPLAY_NAME="$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")"
          BUNDLE_NAME="$(plutil -extract CFBundleName raw "$APP/Info.plist")"
          test "$EXECUTABLE" = "FlekDeck"
          test "$DISPLAY_NAME" = "FlekDeck"
          test "$BUNDLE_NAME" = "FlekDeck"
          test "$BUNDLE_ID" = "com.fs.flekdeck"

          /usr/libexec/PlistBuddy -c 'Delete :ALTAppGroups' "$APP/Info.plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :ALTAppGroups array' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :ALTAppGroups:0 string group.com.SideStore.SideStore' "$APP/Info.plist"

          cp entitlements.xml build/FlekDeck-32bit.entitlements
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/FlekDeck-32bit.entitlements')
          s = p.read_text()
          replacements = {
              '$(DEVELOPMENT_TEAM)': 'AAAAA11111',
              '$(PRODUCT_BUNDLE_IDENTIFIER)': 'com.fs.flekdeck',
              '$(APP_GROUP_SIDESTORE)': 'group.com.SideStore.SideStore',
              '$(APP_GROUP_ALTSTORE)': 'group.com.rileytestut.AltStore',
              '$(AppIdentifierPrefix)': 'AAAAA11111.',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          if '$(' in s:
              raise SystemExit('unresolved entitlement build variable remains')
          p.write_text(s)
          PY
          plutil -lint build/FlekDeck-32bit.entitlements
          ldid -S"$PWD/build/FlekDeck-32bit.entitlements" "$APP/$EXECUTABLE"
          ldid -e "$APP/$EXECUTABLE" > "$PWD/build/FlekDeck-host-entitlements.plist"
          plutil -lint "$PWD/build/FlekDeck-host-entitlements.plist"

          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$PWD/build/FlekDeck-host-entitlements.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$PWD/build/FlekDeck-host-entitlements.plist")" = "AAAAA11111.com.fs.flekdeck"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "com.fs.flekdeck"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = "FlekDeck"
          test "$(plutil -extract CFBundleName raw "$APP/Info.plist")" = "FlekDeck"

          while IFS= read -r PLIST; do
            ID="$(plutil -extract CFBundleIdentifier raw "$PLIST")"
            case "$ID" in
              com.fs.flekdeck.*) ;;
              *) echo "Unexpected embedded bundle identifier: $ID ($PLIST)" >&2; exit 1 ;;
            esac
          done < <(find "$APP/PlugIns" -name Info.plist -type f 2>/dev/null || true)

      - name: Package FlekDeck IPA
        run: |
          set -euxo pipefail
          APP="$(find "$PWD/build/FlekDeck-32bit-temp.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$APP" -type f -name embedded.mobileprovision -delete || true
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          ldid -S"$PWD/build/FlekDeck-32bit.entitlements" "$APP/$EXECUTABLE"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry FlekDeck-temp-32bit.ipa Payload
          unzip -t FlekDeck-temp-32bit.ipa >/dev/null
          shasum -a 256 FlekDeck-temp-32bit.ipa | tee FlekDeck-temp-32bit.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-temp-32bit
          path: |
            build/FlekDeck-temp-32bit.ipa
            build/FlekDeck-temp-32bit.sha256
            build/FlekDeck-host-entitlements.plist
          compression-level: 0
          if-no-files-found: error
