name: Verify user-supplied draft Procursus ROM

on:
  push:
    branches:
      - feature/boot-menu-zip-import
    paths:
      - '.github/workflows/procursus-draft-asset-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 8e213e8893cfc8a00f19783f9ae954a7ac6d3c36363df108dc9e6a8c75fcbf6c
    steps:
      - name: Access draft and retrieve the exact archive
        run: |
          set -euo pipefail
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/416553967" --jq \
            '.assets[] | select(.name == "procursus-jailed.zip" and .size == 45839875) | .id')"
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          echo "Found draft ROM asset ID: ${ASSET_ID}"
          curl -fLsS -L --retry 2 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output procursus-jailed.zip
          test "$(wc -c < procursus-jailed.zip)" = 45839875
          echo "$EXPECTED_SHA  procursus-jailed.zip" | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          from plistlib import loads
          with ZipFile('procursus-jailed.zip') as archive:
              assert archive.testzip() is None
              assert loads(archive.read('ROM/manifest.plist'))['NXRomIdentifier'] == 'org.emexlabs.procursus.jailed'
          print('Draft Procursus asset is accessible and verified.')
          PY
