name: FlekDeck Full Parity Temp IPA

on:
  workflow_dispatch:
  push:
    branches: [temp/32bit-liveexec-data-folder]
    paths:
      - '.github/workflows/build-flekdeck-full-parity-temp.yml'
      - 'Tools/patch_flekdeck_liveexec32.py'
      - 'Tools/patch_flekdeck_liveexec32_appinfo.py'
      - 'Tools/patch_flekdeck_liveexec32_txm.py'
      - 'Tools/patch_flekdeck_livecontainer_parity.py'
      - 'Tools/patch_flekdeck_jitless_parity.py'
      - 'Tools/patch_flekdeck_classic_mode_parity.py'
      - 'Tools/patch_flekdeck_shell_parity.py'
      - 'Resources/universal.js'
      - 'LiveContainer.xcodeproj/project.pbxproj'
      - 'LiveContainer/**'
      - 'LiveContainerSwiftUI/**'

permissions:
  contents: write

jobs:
  build:
    name: Full FlekDeck parity + LiveExec32 r89
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LIVEEXEC_SOURCE_COMMIT: 3f0390e1b2725a2d3c9ab6f3976650a5a295ffba
      LIVEEXEC_BUILD_REVISION: '89'
      LIVEEXEC_LOAD_PATH: Frameworks/LiveExec32Shared.framework/LiveExec32Shared
      LIVEEXEC_ENTRY_SYMBOL: LC32RunGuest
      LIVEEXEC_RUNTIME_URL: https://github.com/NightVibes33/livecontainer-32bit-unsigned-ipa/releases/download/liveexec32-r89/LiveExec32-r89.zip
      LIVEEXEC_RUNTIME_SHA256: 9d35d8d6d4c9c5188e6a53e797de307e6aab579ab43b8fdbb05c8e1b5e8cf7c2

    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Fetch and verify pinned LiveExec32 r89
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/liveexec-source build/liveexec-package
          mkdir -p build/liveexec-source build/liveexec-package/Payload
          RUNTIME_ZIP="$RUNNER_TEMP/LiveExec32-r89.zip"
          curl --fail --location --retry 3 --retry-all-errors -o "$RUNTIME_ZIP" "$LIVEEXEC_RUNTIME_URL"
          echo "$LIVEEXEC_RUNTIME_SHA256  $RUNTIME_ZIP" | shasum -a 256 -c -
          unzip -q "$RUNTIME_ZIP" -d build/liveexec-source
          EMU="$(find build/liveexec-source -maxdepth 2 -type d -name 'LiveExec32.app' -print -quit)"
          test -n "$EMU"
          ditto "$EMU" build/liveexec-package/Payload/LiveExec32.app
          EMU=build/liveexec-package/Payload/LiveExec32.app
          test -f "$EMU/LiveExec32"
          test -f "$EMU/$LIVEEXEC_LOAD_PATH"
          test -d "$EMU/RootFS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitTranslationLayer' "$EMU/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledSourceCommit' "$EMU/Info.plist")" = "$LIVEEXEC_SOURCE_COMMIT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledBuildRevision' "$EMU/Info.plist")" = "$LIVEEXEC_BUILD_REVISION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorLoadPath' "$EMU/Info.plist")" = "$LIVEEXEC_LOAD_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorEntrySymbol' "$EMU/Info.plist")" = "$LIVEEXEC_ENTRY_SYMBOL"
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" | grep -q '_LC32RunGuest'

      - name: Preserve FlekDeck direct-build compatibility
        shell: bash
        run: |
          set -euxo pipefail
          for script in \
            Tools/patch_direct_multitask_host_bridge.py \
            Tools/patch_stikdebug_pid_verification.py \
            Tools/patch_guest_native_pip_bridge.py \
            Tools/patch_youtube_native_pip_render.py \
            Tools/patch_pip_state_separation.py; do
            [ ! -f "$script" ] || python3 "$script"
          done

      - name: Apply ARM32 and full LiveContainer parity
        shell: bash
        run: |
          set -euxo pipefail
          scripts=(
            Tools/patch_flekdeck_liveexec32.py
            Tools/patch_flekdeck_liveexec32_appinfo.py
            Tools/patch_flekdeck_liveexec32_txm.py
            Tools/patch_flekdeck_livecontainer_parity.py
            Tools/patch_flekdeck_jitless_parity.py
            Tools/patch_flekdeck_classic_mode_parity.py
            Tools/patch_flekdeck_shell_parity.py
          )
          python3 -m py_compile "${scripts[@]}"
          for script in "${scripts[@]}"; do python3 "$script"; done

          grep -q 'LCGetDefaultClassicMode' LiveContainerSwiftUI/Utilities/LCUtils.h
          grep -q 'LCSelected32BitEmulator' LiveContainer/LCBootstrap.m
          grep -q 'LC32RunGuest' LiveContainer/LCBootstrap.m
          grep -q 'uiSelected32BitEmulator' LiveContainerSwiftUI/Models/LCAppModel.swift
          grep -q 'Default 32-bit Runtime' LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          grep -q 'LCStorageManagementView' LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          grep -q 'clearNotifications()' LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          grep -q 'LiveProcess Entitlements' LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
          grep -q 'Show FLEX Overlay' LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          grep -q 'homeOpenDataFolder' LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          grep -q 'homeUtilitiesMenuContent' LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          grep -q 'addRepositoryFromDeepLink' LiveContainerSwiftUI/FlekDeck/Install/FlekInstallerView.swift
          grep -q 'case "source"' LiveContainerSwiftUI/Views/LCTabView.swift
          grep -q 'selectedTab = .apps' LiveContainerSwiftUI/Views/LCTabView.swift
          grep -q 'LC32BitTranslationLayerLogFile' LiveContainerSwiftUI/Views/LCTabView.swift
          grep -q 'is32BitSupported=1' LiveContainer.xcodeproj/project.pbxproj
          grep -q 'is32BitSupported' LiveContainer.xcodeproj/project.pbxproj
          test -s Resources/universal.js

          xcrun swiftc -frontend -parse LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Models/LCAppModel.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/AppList/AppSettings/LCAppSettingsView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/LCTabView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/FlekDeck/Install/FlekInstallerView.swift

      - name: Build full parity FlekDeck
        shell: bash
        run: |
          set -uo pipefail
          set +e
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck-full-parity.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | xcpretty
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -nE '(^| )error:|fatal error:|Undefined symbols|duplicate symbol|ld:' build/xcodebuild.log | tail -300 || true
            exit "$status"
          fi

      - name: Embed LiveExec32 and TXM script
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-full-parity.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          EMU=build/liveexec-package/Payload/LiveExec32.app
          test -n "$APP"; test -d "$EMU"; test -s Resources/universal.js
          rm -rf "$APP/LiveExec32.app"
          ditto "$EMU" "$APP/LiveExec32.app"
          ditto Resources/universal.js "$APP/universal.js"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$APP" -type f -name embedded.mobileprovision -delete || true

      - name: Validate integrated archive
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-full-parity.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          HOST_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          EMU="$APP/LiveExec32.app"
          file "$APP/$HOST_EXEC" | grep -q arm64
          test -d "$APP/PlugIns/LiveProcess.appex"
          test -s "$APP/universal.js"
          test -f "$EMU/$LIVEEXEC_LOAD_PATH"
          test -d "$EMU/RootFS"
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" | grep -q '_LC32RunGuest'
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledBuildRevision' "$EMU/Info.plist")" = "$LIVEEXEC_BUILD_REVISION"
          ! find "$APP" \( -name _CodeSignature -o -name embedded.mobileprovision \) -print -quit | grep -q .

      - name: Package unsigned temp IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-full-parity.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP" "build/Payload/$(basename "$APP")"
          cd build
          zip -qry FlekDeck-full-parity-temp-unsigned.ipa Payload
          unzip -t FlekDeck-full-parity-temp-unsigned.ipa >/dev/null
          unzip -l FlekDeck-full-parity-temp-unsigned.ipa | grep -q '/LiveExec32.app/RootFS/'
          unzip -l FlekDeck-full-parity-temp-unsigned.ipa | grep -q '/universal.js'
          shasum -a 256 FlekDeck-full-parity-temp-unsigned.ipa | tee FlekDeck-full-parity-temp-unsigned.sha256

      - name: Upload temp IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-full-parity-temp-unsigned
          path: |
            build/FlekDeck-full-parity-temp-unsigned.ipa
            build/FlekDeck-full-parity-temp-unsigned.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Bake validated full parity into temp source
        shell: bash
        run: |
          set -euxo pipefail
          git reset --hard "$GITHUB_SHA"
          git clean -fd

          scripts=(
            Tools/patch_flekdeck_liveexec32.py
            Tools/patch_flekdeck_liveexec32_appinfo.py
            Tools/patch_flekdeck_liveexec32_txm.py
            Tools/patch_flekdeck_livecontainer_parity.py
            Tools/patch_flekdeck_jitless_parity.py
            Tools/patch_flekdeck_classic_mode_parity.py
            Tools/patch_flekdeck_shell_parity.py
          )
          for script in "${scripts[@]}"; do python3 "$script"; done

          git add -- \
            LiveContainer.xcodeproj/project.pbxproj \
            LiveContainer/LCBootstrap.m \
            LiveContainer/LCSharedUtils.h \
            LiveContainer/LCSharedUtils.m \
            LiveContainer/LCMachOUtils.h \
            LiveContainer/LCMachOUtils.m \
            LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift \
            LiveContainerSwiftUI/Utilities/Shared.swift \
            LiveContainerSwiftUI/Utilities/LCUtils.h \
            LiveContainerSwiftUI/Utilities/LCUtils.m \
            LiveContainerSwiftUI/Utilities/LCUtilsExtensions.swift \
            LiveContainerSwiftUI/Models/LCAppInfo.h \
            LiveContainerSwiftUI/Models/LCAppInfo.m \
            LiveContainerSwiftUI/Models/LCAppModel.swift \
            LiveContainerSwiftUI/Views/AppList/AppSettings/LCAppSettingsView.swift \
            LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift \
            LiveContainerSwiftUI/Views/AppList/LCAppListView.swift \
            LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift \
            LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift \
            LiveContainerSwiftUI/Views/LCTabView.swift \
            LiveContainerSwiftUI/FlekDeck/Install/FlekInstallerView.swift

          if git diff --cached --quiet; then
            echo 'Full parity integration is already baked into source.'
            exit 0
          fi

          git config user.name 'NightVibes33 Actions'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Bake validated LiveContainer parity into FlekDeck temp source'
          git push origin HEAD:temp/32bit-liveexec-data-folder
