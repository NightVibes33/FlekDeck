name: FlekDeck Final On-Device Audit

on:
  workflow_dispatch:
  push:
    branches: [temp/32bit-liveexec-data-folder]
    paths:
      - '.github/workflows/flekdeck-final-ondevice-audit.yml'
      - 'Tools/patch_flekdeck_runtime_guardrails.py'
      - 'Tools/patch_flekdeck_postscan_runtime.py'
      - 'Tools/patch_flekdeck_user_regressions.py'
      - 'Tools/patch_flekdeck_ondevice_regressions.py'
      - 'Tools/patch_flekdeck_liveexec32_loader_guard.py'
      - 'Tools/patch_flekdeck_error_transport.py'
      - 'Tools/patch_flekdeck_macho_contract.py'
      - 'Tools/patch_flekdeck_macho_sdk_reader.py'
      - 'Tools/patch_flekdeck_arm32_migration.py'
      - 'Tools/patch_flekdeck_liveexec32_txm.py'
      - 'Tools/patch_flekdeck_runtime_selection.py'
      - 'Tools/patch_flekdeck_classic_launch_isolation.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LIVEEXEC_RUNTIME_URL: https://github.com/NightVibes33/livecontainer-32bit-unsigned-ipa/releases/download/liveexec32-r89/LiveExec32-r89.zip
      LIVEEXEC_RUNTIME_SHA256: 9d35d8d6d4c9c5188e6a53e797de307e6aab579ab43b8fdbb05c8e1b5e8cf7c2
      LIVEEXEC_LOAD_PATH: Frameworks/LiveExec32Shared.framework/LiveExec32Shared

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Apply audited parity guardrails
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            Tools/patch_flekdeck_runtime_guardrails.py \
            Tools/patch_flekdeck_postscan_runtime.py \
            Tools/patch_flekdeck_user_regressions.py \
            Tools/patch_flekdeck_ondevice_regressions.py \
            Tools/patch_flekdeck_liveexec32_loader_guard.py \
            Tools/patch_flekdeck_error_transport.py \
            Tools/patch_flekdeck_macho_contract.py \
            Tools/patch_flekdeck_macho_sdk_reader.py \
            Tools/patch_flekdeck_arm32_migration.py \
            Tools/patch_flekdeck_liveexec32_txm.py \
            Tools/patch_flekdeck_runtime_selection.py \
            Tools/patch_flekdeck_classic_launch_isolation.py
          python3 Tools/patch_flekdeck_runtime_guardrails.py

          # Error authenticity: show only the real backend string.
          ! grep -q 'No diagnostic text was provided' LiveContainerSwiftUI/Views/LCTabView.swift
          ! grep -q 'No diagnostic text was provided' LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          ! grep -q 'errorStr = "lc.signer.crashDuringSignErr"' LiveContainerSwiftUI/Views/LCTabView.swift
          grep -q 'let presentedGuestCrash = checkLastLaunchError()' LiveContainerSwiftUI/Views/LCTabView.swift
          grep -q 'ShareLink(item: errorInfo)' LiveContainerSwiftUI/Views/LCTabView.swift
          grep -q 'Bookmark resolution failed without an NSError.' LiveContainer/LCBootstrap.m
          grep -q 'Security-scoped access denied for data container:' LiveContainer/LCBootstrap.m
          ! grep -q 'The security-scoped resource denied access.' LiveContainer/LCBootstrap.m
          ! grep -q 'stringByAppendingString:err.localizedDescription' LiveContainer/LCBootstrap.m

          # Compatibility Mode: real LiveContainer-style probe, but fail closed.
          ! sed -n '/- (void)setClassicMode:/,/- (NSUInteger)defaultClassicMode/p' LiveContainerSwiftUI/Models/LCAppInfo.m | grep -q 'defaultClassicMode]'
          grep -q 'let classicMode: UInt = multitask ? 0 : appInfo.defaultClassicMode' LiveContainerSwiftUI/Models/LCAppModel.swift
          ! grep -q 'NSCAssert(' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          ! grep -q 'assert(' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          grep -q '_defaultClassicMode' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          grep -q 'instancesRespondToSelector:modernInit' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          grep -q 'LCInspectMachOArchitectures' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          grep -q 'LCReadMachOSDKVersion' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          grep -q 'probe failed safely' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          ! grep -q 'return @12;' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          ! grep -q 'return @1;' LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m
          grep -q 'if(success)' LiveContainer/LCSharedUtils.m
          grep -q 'falling back to normal launch' LiveContainer/LCSharedUtils.m
          ! grep -q 'guestSupportsPad' LiveContainer/LCSharedUtils.m

          # Shared settings and immediate relaunch failures must be real.
          grep -q 'if(!lcSharedDefaults)' LiveContainer/LCBootstrap.m
          grep -q 'guard LCSharedUtils.launchToGuestApp(withClassicMode: classicMode) else' LiveContainerSwiftUI/Models/LCAppModel.swift

          # Home keeps main's gesture ownership. Open Data Folder is context menu only.
          ! grep -q 'longPressGesture.delegate = dragManager' LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardViewController.swift
          ! grep -q 'gestureRecognizerShouldBegin' LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardDragManager.swift
          grep -q 'homeOpenDataFolder' LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          grep -q 'lc.appBanner.openDataFolder' LiveContainerSwiftUI/Views/AppList/LCAppListView.swift

          # ARM32 runtime integrity.
          grep -q 'guestExecutablePath.length == 0' LiveContainer/LCBootstrap.m
          grep -q 'hasLoadPath != hasEntrySymbol' LiveContainer/LCBootstrap.m
          grep -q 'LCInspectMachOArchitectures' LiveContainer/LCMachOUtils.h
          grep -q 'LCReadMachOSDKVersion' LiveContainer/LCMachOUtils.h
          grep -q 'needsArchitectureClassification' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -q 'is32bit = !has64bitSlice && has32bitSlice' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -q 'Runtime seed failed without blocking app discovery' LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          grep -q 'Repaired stale default runtime' LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          grep -q 'isTXMScriptRequired' LiveContainerSwiftUI/Utilities/LCUtils.m
          grep -q 'pathForResource:@"universal"' LiveContainerSwiftUI/Utilities/LCUtils.m
          grep -q 'self.is32bit && LCUtils.isTXMScriptRequired' LiveContainerSwiftUI/Models/LCAppInfo.m

          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/LCTabView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Models/LCAppModel.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardDragManager.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardViewController.swift

      - name: Preserve non-switcher direct-build compatibility
        run: |
          set -euxo pipefail
          for script in \
            Tools/patch_stikdebug_pid_verification.py \
            Tools/patch_guest_native_pip_bridge.py \
            Tools/patch_youtube_native_pip_render.py \
            Tools/patch_pip_state_separation.py; do
            [ ! -f "$script" ] || python3 "$script"
          done

      - name: Restore exact generated main Home switcher
        run: |
          set -euxo pipefail
          git fetch --no-tags origin main
          rm -rf /tmp/flek-main-switcher
          git worktree add --detach /tmp/flek-main-switcher origin/main

          # Reproduce main's actual direct-build switcher surface, including the
          # Objective-C host-window selector LCUtils calls, then its Single/Home
          # bottom-swipe compatibility layer.
          (cd /tmp/flek-main-switcher && python3 Tools/patch_direct_multitask_host_bridge.py)
          (cd /tmp/flek-main-switcher && python3 Tools/patch_parallel_guest_viewport.py)

          protected=(
            MultitaskSupport/MultitaskDockView.swift
            MultitaskSupport/DecoratedAppSceneViewController.m
            MultitaskSupport/MultitaskAppWindow.swift
            LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardDragManager.swift
            LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardViewController.swift
          )
          for p in "${protected[@]}"; do
            cp "/tmp/flek-main-switcher/$p" "$p"
          done

          # Rebuild only the guest hook side against the protected main host.
          python3 Tools/patch_parallel_guest_viewport.py

          for p in "${protected[@]}"; do
            ref_hash="$(git -C /tmp/flek-main-switcher hash-object "$p")"
            built_hash="$(git hash-object "$p")"
            test "$built_hash" = "$ref_hash" || {
              echo "MAIN HOME/SWITCHER REGRESSION: $p differs from generated main" >&2
              diff -u "/tmp/flek-main-switcher/$p" "$p" || true
              exit 1
            }
          done

          grep -q '@objc(prepareHostWindowForGuestLaunch)' MultitaskSupport/MultitaskDockView.swift
          grep -q 'FlekHomeSingleSwitcherGestureBridge' MultitaskSupport/MultitaskDockView.swift
          grep -q 'FlekSingleGuestSwitcherGestureRequested' MultitaskSupport/MultitaskDockView.swift
          grep -q 'MultitaskSwipeZone' MultitaskSupport/MultitaskDockView.swift
          grep -q 'LCSingleGuestSwitcherGestureBridge' TweakLoader/UIKit+GuestHooks.m
          grep -q '!hasForegroundAppWindow()' MultitaskSupport/MultitaskDockView.swift
          ! grep -q 'longPressGesture.delegate = dragManager' LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardViewController.swift
          ! grep -q 'gestureRecognizerShouldBegin' LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardDragManager.swift
          xcrun swiftc -frontend -parse MultitaskSupport/MultitaskDockView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardDragManager.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardViewController.swift

      - name: Static analyzer
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          xcodebuild analyze \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/analyze.log | xcpretty
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -qE '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld:.*error' build/analyze.log; then
              grep -nE '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld:.*error' build/analyze.log | tail -300 || true
              exit "$status"
            fi
            echo "Analyzer returned $status for analyzer findings/warnings only; strict Release archive will decide build validity."
          fi

      - name: Strict Release archive
        run: |
          set -uo pipefail
          mkdir -p build
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck-final-audit.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/archive.log | xcpretty
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE '(^|[[:space:]])error:|fatal error:|Undefined symbols|duplicate symbol|ld:' build/archive.log | tail -350 || true
            exit "$status"
          fi

      - name: Embed verified LiveExec32 and package IPA
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/LiveExec32-r89.zip"
          curl --fail --location --retry 3 --retry-all-errors -o "$ZIP" "$LIVEEXEC_RUNTIME_URL"
          echo "$LIVEEXEC_RUNTIME_SHA256  $ZIP" | shasum -a 256 -c -
          rm -rf build/liveexec-source build/Payload
          mkdir -p build/liveexec-source build/Payload
          unzip -q "$ZIP" -d build/liveexec-source
          EMU="$(find build/liveexec-source -maxdepth 2 -type d -name LiveExec32.app -print -quit)"
          APP="$(find build/FlekDeck-final-audit.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$EMU"; test -n "$APP"
          test -f "$EMU/$LIVEEXEC_LOAD_PATH"; test -d "$EMU/RootFS"; test -s Resources/universal.js
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" > "$RUNNER_TEMP/liveexec32.symbols"
          grep -q '_LC32RunGuest' "$RUNNER_TEMP/liveexec32.symbols"
          rm -rf "$APP/LiveExec32.app"
          ditto "$EMU" "$APP/LiveExec32.app"
          ditto Resources/universal.js "$APP/universal.js"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$APP" -type f -name embedded.mobileprovision -delete || true
          ditto "$APP" "build/Payload/$(basename "$APP")"
          cd build
          zip -qry FlekDeck-final-ondevice-audit-temp-unsigned.ipa Payload
          unzip -t FlekDeck-final-ondevice-audit-temp-unsigned.ipa >/dev/null
          shasum -a 256 FlekDeck-final-ondevice-audit-temp-unsigned.ipa | tee FlekDeck-final-ondevice-audit-temp-unsigned.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-final-ondevice-audit-temp-unsigned
          path: |
            build/FlekDeck-final-ondevice-audit-temp-unsigned.ipa
            build/FlekDeck-final-ondevice-audit-temp-unsigned.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Bake only validated runtime/error fixes
        run: |
          set -euxo pipefail
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          python3 Tools/patch_flekdeck_runtime_guardrails.py
          git add -- \
            Tools/patch_flekdeck_runtime_guardrails.py \
            Tools/patch_flekdeck_postscan_runtime.py \
            Tools/patch_flekdeck_user_regressions.py \
            Tools/patch_flekdeck_runtime_stability.py \
            Tools/patch_flekdeck_ondevice_regressions.py \
            Tools/patch_flekdeck_liveexec32_loader_guard.py \
            Tools/patch_flekdeck_error_transport.py \
            Tools/patch_flekdeck_macho_contract.py \
            Tools/patch_flekdeck_macho_sdk_reader.py \
            Tools/patch_flekdeck_arm32_migration.py \
            Tools/patch_flekdeck_liveexec32_txm.py \
            Tools/patch_flekdeck_runtime_selection.py \
            Tools/patch_flekdeck_classic_launch_isolation.py \
            Tools/patch_flekdeck_error_ui_parity.py \
            LiveContainer/LCBootstrap.m \
            LiveContainer/LCSharedUtils.m \
            LiveContainer/LCMachOUtils.h \
            LiveContainer/LCMachOUtils.m \
            LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift \
            LiveContainerSwiftUI/Utilities/OfflineClassicModeProbe.m \
            LiveContainerSwiftUI/Utilities/LCUtils.h \
            LiveContainerSwiftUI/Utilities/LCUtils.m \
            LiveContainerSwiftUI/Utilities/LCUtilsExtensions.swift \
            LiveContainerSwiftUI/Models/LCAppInfo.m \
            LiveContainerSwiftUI/Models/LCAppModel.swift \
            LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardDragManager.swift \
            LiveContainerSwiftUI/FlekDeck/Springboard/LCSpringboardViewController.swift \
            LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift \
            LiveContainerSwiftUI/Views/LCTabView.swift \
            LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'NightVibes33 Actions'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Bake audited on-device runtime fixes'
          git push origin HEAD:temp/32bit-liveexec-data-folder
