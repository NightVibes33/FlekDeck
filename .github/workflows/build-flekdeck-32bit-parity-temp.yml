name: FlekDeck ARM32 + Parity Temp IPA

on:
  workflow_dispatch:
  push:
    branches: [temp/32bit-liveexec-data-folder]
    paths:
      - '.github/workflows/build-flekdeck-32bit-parity-temp.yml'
      - 'Tools/patch_flekdeck_liveexec32.py'
      - 'Tools/patch_flekdeck_liveexec32_appinfo.py'
      - 'Tools/patch_flekdeck_livecontainer_parity.py'
      - 'Tools/patch_flekdeck_jitless_parity.py'
      - 'Tools/patch_flekdeck_classic_mode.py'
      - 'LiveContainer/**'
      - 'LiveContainerSwiftUI/**'
      - 'MultitaskSupport/**'
      - 'TweakLoader/**'

permissions:
  contents: read

jobs:
  build:
    name: Build FlekDeck ARM32 parity temp
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LIVEEXEC_SOURCE_COMMIT: 3f0390e1b2725a2d3c9ab6f3976650a5a295ffba
      LIVEEXEC_BUILD_REVISION: '89'
      LIVEEXEC_LOAD_PATH: Frameworks/LiveExec32Shared.framework/LiveExec32Shared
      LIVEEXEC_ENTRY_SYMBOL: LC32RunGuest
      LIVEEXEC_RUNTIME_URL: https://github.com/NightVibes33/livecontainer-32bit-unsigned-ipa/releases/download/liveexec32-r89/LiveExec32-r89.zip
      LIVEEXEC_RUNTIME_SHA256: 9d35d8d6d4c9c5188e6a53e797de307e6aab579ab43b8fdbb05c8e1b5e8cf7c2

    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch pinned LiveExec32 r89 runtime
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/liveexec-package
          mkdir -p build/liveexec-package/Payload
          RUNTIME_ZIP="$RUNNER_TEMP/LiveExec32-r89.zip"
          curl --fail --location --retry 3 --retry-all-errors -o "$RUNTIME_ZIP" "$LIVEEXEC_RUNTIME_URL"
          echo "$LIVEEXEC_RUNTIME_SHA256  $RUNTIME_ZIP" | shasum -a 256 -c -
          unzip -q "$RUNTIME_ZIP" -d build/liveexec-package/Payload
          test -d build/liveexec-package/Payload/LiveExec32.app

      - name: Verify pinned runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          EMU=build/liveexec-package/Payload/LiveExec32.app
          test -f "$EMU/LiveExec32"
          test -f "$EMU/$LIVEEXEC_LOAD_PATH"
          test -d "$EMU/RootFS"
          test -f "$EMU/RootFS/usr/lib/libstdc++.6.dylib"
          test -f "$EMU/RootFS/usr/lib/libiconv.2.dylib"
          test -f "$EMU/RootFS/usr/lib/libcharset.1.dylib"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitTranslationLayer' "$EMU/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledSourceCommit' "$EMU/Info.plist")" = "$LIVEEXEC_SOURCE_COMMIT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledBuildRevision' "$EMU/Info.plist")" = "$LIVEEXEC_BUILD_REVISION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorLoadPath' "$EMU/Info.plist")" = "$LIVEEXEC_LOAD_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorEntrySymbol' "$EMU/Info.plist")" = "$LIVEEXEC_ENTRY_SYMBOL"
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" > "$RUNNER_TEMP/liveexec32.symbols"
          grep -q '_LC32RunGuest' "$RUNNER_TEMP/liveexec32.symbols"

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Preserve FlekDeck host and Parallel compatibility
        shell: bash
        run: |
          set -euxo pipefail
          for script in \
            Tools/patch_direct_multitask_host_bridge.py \
            Tools/patch_stikdebug_pid_verification.py \
            Tools/patch_guest_native_pip_bridge.py \
            Tools/patch_youtube_native_pip_render.py \
            Tools/patch_pip_state_separation.py; do
            [ ! -f "$script" ] || python3 "$script"
          done

      - name: Apply ARM32 and LiveContainer parity adapters
        shell: bash
        run: |
          set -euxo pipefail
          python3 Tools/patch_flekdeck_liveexec32.py
          python3 Tools/patch_flekdeck_liveexec32_appinfo.py
          python3 Tools/patch_flekdeck_livecontainer_parity.py
          python3 Tools/patch_flekdeck_jitless_parity.py
          python3 Tools/patch_flekdeck_classic_mode.py
          python3 -m py_compile \
            Tools/patch_flekdeck_liveexec32.py \
            Tools/patch_flekdeck_liveexec32_appinfo.py \
            Tools/patch_flekdeck_livecontainer_parity.py \
            Tools/patch_flekdeck_jitless_parity.py \
            Tools/patch_flekdeck_classic_mode.py

          # ARM32 runtime contract.
          grep -q 'LCSelected32BitEmulator' LiveContainer/LCBootstrap.m
          grep -q 'dlsym(appHandle, emulatorEntrySymbol.UTF8String)' LiveContainer/LCBootstrap.m
          grep -q 'bool is32bit = self.is32bit' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -q 'self.isJITNeeded = YES' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -q 'self.classicMode = YES' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -q 'seedBundled32BitRuntime' LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          grep -q 'arm32EmuApps' LiveContainerSwiftUI/Utilities/Shared.swift
          grep -q 'uiSelected32BitEmulator' LiveContainerSwiftUI/Models/LCAppModel.swift

          # Settings/data/JIT-less parity without restoring LC Multitask.
          grep -q 'Default 32-bit Runtime' LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          grep -q 'LCStorageManagementView' LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          grep -q 'clearNotifications()' LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          grep -q 'LiveProcess Entitlements' LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
          grep -q 'LC32BitTranslationLayerLogFile' LiveContainerSwiftUI/Views/LCTabView.swift

          # FlekDeck-specific boundaries.
          grep -q 'classicMode != 0' LiveContainerSwiftUI/Models/LCAppModel.swift
          grep -q 'appInfo.is32bit || classicMode != 0' LiveContainerSwiftUI/Models/LCAppModel.swift
          grep -q 'launchToGuestApp(withClassicMode: classicMode)' LiveContainerSwiftUI/Models/LCAppModel.swift
          grep -q 'FBSOpenApplicationOptionKeyActivateAsClassic' LiveContainer/LCSharedUtils.m
          grep -q 'if model.uiSelectedContainer != nil' LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift
          ! grep -q 'if !model.uiIsShared, model.uiSelectedContainer != nil' LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift

          xcrun swiftc -frontend -parse LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Models/LCAppModel.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/AppList/AppSettings/LCAppSettingsView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/LCTabView.swift

      - name: Build FlekDeck with ARM32 support
        shell: bash
        run: |
          set -uo pipefail
          set +e
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck-32bit.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) is32BitSupported=1' \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) is32BitSupported' \
            2>&1 | tee build/xcodebuild.log | xcpretty
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -nE '(^| )error:|fatal error:|Undefined symbols|duplicate symbol|ld:' build/xcodebuild.log | tail -350 || true
            exit "$status"
          fi

      - name: Embed pinned LiveExec32 into FlekDeck
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-32bit.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          EMU=build/liveexec-package/Payload/LiveExec32.app
          test -n "$APP"; test -d "$EMU"
          rm -rf "$APP/LiveExec32.app"
          ditto "$EMU" "$APP/LiveExec32.app"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$APP" -type f -name embedded.mobileprovision -delete || true

      - name: Validate integrated archive
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-32bit.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          HOST_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          EMU="$APP/LiveExec32.app"
          file "$APP/$HOST_EXEC" | grep -q arm64
          test -d "$APP/PlugIns/LiveProcess.appex"
          test -f "$EMU/$LIVEEXEC_LOAD_PATH"
          test -d "$EMU/RootFS"
          test -f "$EMU/RootFS/usr/lib/libstdc++.6.dylib"
          test -f "$EMU/RootFS/usr/lib/libiconv.2.dylib"
          test -f "$EMU/RootFS/usr/lib/libcharset.1.dylib"
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" > "$RUNNER_TEMP/embedded-liveexec32.symbols"
          grep -q '_LC32RunGuest' "$RUNNER_TEMP/embedded-liveexec32.symbols"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledSourceCommit' "$EMU/Info.plist")" = "$LIVEEXEC_SOURCE_COMMIT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledBuildRevision' "$EMU/Info.plist")" = "$LIVEEXEC_BUILD_REVISION"
          grep -q 'emulatorArgv0' LiveContainer/LCBootstrap.m
          grep -q 'uiSelected32BitEmulator' LiveContainerSwiftUI/Models/LCAppModel.swift
          grep -q 'LiveProcess Entitlements' LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
          grep -q 'launchToGuestAppWithClassicMode' LiveContainer/LCSharedUtils.m
          ! find "$APP" \( -name _CodeSignature -o -name embedded.mobileprovision \) -print -quit | grep -q .

      - name: Package unsigned temp IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-32bit.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP" "build/Payload/$(basename "$APP")"
          cd build
          zip -qry FlekDeck-ARM32-parity-temp-unsigned.ipa Payload
          unzip -t FlekDeck-ARM32-parity-temp-unsigned.ipa >/dev/null
          unzip -l FlekDeck-ARM32-parity-temp-unsigned.ipa | grep -q '/LiveExec32.app/RootFS/'
          shasum -a 256 FlekDeck-ARM32-parity-temp-unsigned.ipa | tee FlekDeck-ARM32-parity-temp-unsigned.sha256

      - name: Upload temp IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-ARM32-parity-temp-unsigned
          path: |
            build/FlekDeck-ARM32-parity-temp-unsigned.ipa
            build/FlekDeck-ARM32-parity-temp-unsigned.sha256
          if-no-files-found: error
          compression-level: 0