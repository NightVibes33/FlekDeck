name: FlekDeck 32-bit Temp IPA

on:
  workflow_dispatch:
  push:
    branches:
      - temp/32bit-liveexec-data-folder
    paths:
      - '.github/workflows/build-flekdeck-32bit-temp.yml'
      - 'Tools/patch_flekdeck_liveexec32.py'
      - 'LiveContainer/**'
      - 'LiveContainerSwiftUI/**'
      - 'MultitaskSupport/**'
      - 'TweakLoader/**'

permissions:
  contents: read

jobs:
  build:
    name: Build FlekDeck + LiveExec32 revision 89
    runs-on: macos-26
    timeout-minutes: 90
    env:
      LIVEEXEC_SOURCE_COMMIT: 3f0390e1b2725a2d3c9ab6f3976650a5a295ffba
      LIVEEXEC_BUILD_REVISION: '89'
      LIVEEXEC_COMPAT_COMMIT: 44733db43df3a50849abddd31ff52ac021d0fede
      LIVEEXEC_LOAD_PATH: Frameworks/LiveExec32Shared.framework/LiveExec32Shared
      LIVEEXEC_ENTRY_SYMBOL: LC32RunGuest

    steps:
      - name: Checkout FlekDeck temp branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26.2 for LiveExec32
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout pinned LiveExec32 source and compatibility layer
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/LiveExec32 build/liveexec-compat
          mkdir -p build

          git clone --filter=blob:none --no-checkout \
            https://github.com/LiveContainer/LiveExec32.git build/LiveExec32
          git -C build/LiveExec32 fetch --depth 1 origin "$LIVEEXEC_SOURCE_COMMIT"
          git -C build/LiveExec32 checkout --detach FETCH_HEAD
          git -C build/LiveExec32 submodule update --init --recursive --depth 1
          test "$(git -C build/LiveExec32 rev-parse HEAD)" = "$LIVEEXEC_SOURCE_COMMIT"

          git clone --filter=blob:none --no-checkout \
            https://github.com/NightVibes33/livecontainer-32bit-unsigned-ipa.git build/liveexec-compat
          git -C build/liveexec-compat fetch --depth 1 origin "$LIVEEXEC_COMPAT_COMMIT"
          git -C build/liveexec-compat checkout --detach FETCH_HEAD
          test "$(git -C build/liveexec-compat rev-parse HEAD)" = "$LIVEEXEC_COMPAT_COMMIT"
          test -f build/liveexec-compat/.github/scripts/patch-liveexec32-missing-images.py
          test -f build/liveexec-compat/.github/scripts/build-guest-libiconv.sh

      - name: Restore LiveExec32 package cache
        id: liveexec-cache
        uses: actions/cache/restore@v4
        with:
          path: build/liveexec-package
          key: flekdeck-liveexec32-r89-${{ runner.os }}-${{ env.LIVEEXEC_SOURCE_COMMIT }}-${{ env.LIVEEXEC_COMPAT_COMMIT }}

      - name: Restore LiveExec32 ramdisk cache
        if: steps.liveexec-cache.outputs.cache-hit != 'true'
        id: ramdisk-cache
        uses: actions/cache/restore@v4
        with:
          path: build/LiveExec32/tmp/ipsw/ramdisk.dmg
          key: flekdeck-liveexec32-ramdisk-3564d16366b053503107288be6cb335b2283cf14838ab64a88017c17a2a6a1bc

      - name: Install LiveExec32 build dependencies
        if: steps.liveexec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          brew install make boost ldid

          THEOS="$RUNNER_TEMP/theos"
          THEOS_COMMIT=5280bd038207e14f8bd76f5417aa2fe641c03228
          git init "$THEOS"
          git -C "$THEOS" remote add origin https://github.com/theos/theos.git
          git -C "$THEOS" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$THEOS" checkout --detach FETCH_HEAD
          git -C "$THEOS" submodule update --init --recursive --depth 1

          SDK_ARCHIVE="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          curl --fail --location --retry 3 --output "$SDK_ARCHIVE" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          echo "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  $SDK_ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$THEOS/sdks"
          tar -xJf "$SDK_ARCHIVE" -C "$THEOS/sdks"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          PZB_ARCHIVE="$RUNNER_TEMP/pzb.zip"
          PZB_ROOT="$RUNNER_TEMP/pzb"
          TOOLS_DIR="$RUNNER_TEMP/lc32-tools"
          curl --fail --location --retry 3 --output "$PZB_ARCHIVE" \
            https://github.com/tihmstar/partialZipBrowser/releases/download/44/buildroot_macos-latest.zip
          echo "f72452e5c9c1248b8c4b4967a357b03addbe98d61ba8bad286ef0146dfdccdd2  $PZB_ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$PZB_ROOT" "$TOOLS_DIR"
          unzip -q "$PZB_ARCHIVE" -d "$PZB_ROOT"
          install -m 0755 "$PZB_ROOT/buildroot_macos-latest/usr/local/bin/pzb" "$TOOLS_DIR/pzb"
          echo "$TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Build pinned LiveExec32 runtime
        if: steps.liveexec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          SCRIPTS="$PWD/build/liveexec-compat/.github/scripts"
          test -f build/LiveExec32/GuestFrameworks/CoreVideo/CoreVideo.m
          test -f build/LiveExec32/GuestFrameworks/CoreMedia/CoreMediaSampleBuffer.m
          test -f build/LiveExec32/test/audio_converter.c

          gmake -C build/LiveExec32/GuestMakefile generate-shims
          python3 "$SCRIPTS/patch-liveexec32-missing-images.py"
          python3 "$SCRIPTS/patch-liveexec32-accelerate.py"
          python3 "$SCRIPTS/patch-liveexec32-coremedia.py"
          python3 "$SCRIPTS/patch-liveexec32-corpus-object-constants.py"
          python3 "$SCRIPTS/patch-liveexec32-quartzcore.py"
          python3 "$SCRIPTS/patch-liveexec32-target-coregraphics.py"
          python3 "$SCRIPTS/patch-liveexec32-host-argument.py"
          python3 "$SCRIPTS/patch-liveexec32-openal-session.py"
          python3 "$SCRIPTS/patch-liveexec32-noexecute-diagnostics.py"

          gmake -C build/LiveExec32/GuestMakefile
          (cd build/LiveExec32 && bash GuestMakefile/pack-ramdisk.sh)

          GUEST_ROOT=build/LiveExec32/Resources/RootFS
          for framework in CoreSurface GraphicsServices PlugInKit WebKit; do
            source="$GUEST_ROOT/System/Library/Frameworks/$framework.framework"
            destination="$GUEST_ROOT/System/Library/PrivateFrameworks/$framework.framework"
            if [ ! -f "$source/$framework" ]; then
              echo "LiveExec32 does not provide $framework; import audit handles the gap"
              continue
            fi
            mkdir -p "$destination"
            cp "$source/$framework" "$destination/$framework"
            cp "$source/Info.plist" "$destination/Info.plist"
            chmod 0755 "$destination/$framework"
          done

          cp "$GUEST_ROOT/System/Library/Frameworks/LC32.framework/LC32" \
            "$GUEST_ROOT/usr/lib/libresolv.9.dylib"
          chmod 0755 "$GUEST_ROOT/usr/lib/libresolv.9.dylib"

          bash "$SCRIPTS/build-guest-libiconv.sh" "$GUEST_ROOT"
          gmake -C build/LiveExec32 package

          LIVEEXEC_IPA="$(find build/LiveExec32/packages -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$LIVEEXEC_IPA"
          rm -rf build/liveexec-package
          mkdir -p build/liveexec-package
          unzip -q "$LIVEEXEC_IPA" -d build/liveexec-package

          EMU="$(find build/liveexec-package/Payload -maxdepth 1 -type d -name 'LiveExec32.app' -print -quit)"
          test -n "$EMU"
          test -f "$EMU/LiveExec32"
          test -f "$EMU/$LIVEEXEC_LOAD_PATH"
          test -d "$EMU/RootFS"
          test -f "$EMU/RootFS/usr/lib/libstdc++.6.dylib"
          test -f "$EMU/RootFS/usr/lib/libiconv.2.dylib"
          test -f "$EMU/RootFS/usr/lib/libcharset.1.dylib"
          file "$EMU/LiveExec32" | grep -q 'executable arm64'
          otool -hv "$EMU/$LIVEEXEC_LOAD_PATH" | grep -q DYLIB
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" | grep -q '_LC32RunGuest'

          /usr/libexec/PlistBuddy -c 'Delete :LC32BitTranslationLayer' "$EMU/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LC32BitTranslationLayer bool true' "$EMU/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :LCBundledSourceCommit' "$EMU/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LCBundledSourceCommit string $LIVEEXEC_SOURCE_COMMIT" "$EMU/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :LCBundledBuildRevision' "$EMU/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LCBundledBuildRevision string $LIVEEXEC_BUILD_REVISION" "$EMU/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :LC32BitEmulatorLoadPath' "$EMU/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LC32BitEmulatorLoadPath string $LIVEEXEC_LOAD_PATH" "$EMU/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :LC32BitEmulatorEntrySymbol' "$EMU/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LC32BitEmulatorEntrySymbol string $LIVEEXEC_ENTRY_SYMBOL" "$EMU/Info.plist"

      - name: Save LiveExec32 package cache
        if: steps.liveexec-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/liveexec-package
          key: ${{ steps.liveexec-cache.outputs.cache-primary-key }}

      - name: Save LiveExec32 ramdisk cache
        if: steps.liveexec-cache.outputs.cache-hit != 'true' && steps.ramdisk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/LiveExec32/tmp/ipsw/ramdisk.dmg
          key: flekdeck-liveexec32-ramdisk-3564d16366b053503107288be6cb335b2283cf14838ab64a88017c17a2a6a1bc

      - name: Verify cached or freshly built LiveExec32 runtime
        shell: bash
        run: |
          set -euxo pipefail
          EMU="$(find build/liveexec-package/Payload -maxdepth 1 -type d -name 'LiveExec32.app' -print -quit)"
          test -n "$EMU"
          test -f "$EMU/Info.plist"
          test -f "$EMU/LiveExec32"
          test -f "$EMU/$LIVEEXEC_LOAD_PATH"
          test -d "$EMU/RootFS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitTranslationLayer' "$EMU/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledSourceCommit' "$EMU/Info.plist")" = "$LIVEEXEC_SOURCE_COMMIT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledBuildRevision' "$EMU/Info.plist")" = "$LIVEEXEC_BUILD_REVISION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorLoadPath' "$EMU/Info.plist")" = "$LIVEEXEC_LOAD_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorEntrySymbol' "$EMU/Info.plist")" = "$LIVEEXEC_ENTRY_SYMBOL"
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" | grep -q '_LC32RunGuest'

      - name: Select Xcode 26.6 for FlekDeck
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Preserve FlekDeck direct-build compatibility
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            Tools/patch_direct_multitask_host_bridge.py \
            Tools/patch_stikdebug_pid_verification.py \
            Tools/patch_guest_native_pip_bridge.py \
            Tools/patch_youtube_native_pip_render.py \
            Tools/patch_pip_state_separation.py; do
            if [ -f "$script" ]; then
              python3 "$script"
            fi
          done

      - name: Apply LiveExec32 and data-folder integration
        shell: bash
        run: |
          set -euxo pipefail
          python3 Tools/patch_flekdeck_liveexec32.py
          python3 -m py_compile Tools/patch_flekdeck_liveexec32.py
          grep -q 'LCSelected32BitEmulator' LiveContainer/LCBootstrap.m
          grep -q 'LC32BitEmulatorLoadPath' LiveContainer/LCBootstrap.m
          grep -q 'LC32BitEmulatorEntrySymbol' LiveContainer/LCBootstrap.m
          grep -q 'dlsym(appHandle, emulatorEntrySymbol.UTF8String)' LiveContainer/LCBootstrap.m
          grep -q 'seedBundled32BitRuntime' LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          grep -q 'if model.uiSelectedContainer != nil' LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift
          ! grep -q 'if !model.uiIsShared, model.uiSelectedContainer != nil' LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift

      - name: Build ARM64 FlekDeck host with ARM32 guest support
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck-32bit.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) is32BitSupported=1' \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) is32BitSupported' \
            2>&1 | tee build/xcodebuild.log | xcpretty
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- compiler/linker errors ---'
            grep -nE '(^| )error:|fatal error:|Undefined symbols|duplicate symbol|ld:' build/xcodebuild.log | tail -300 || true
            exit "$status"
          fi

      - name: Embed pinned LiveExec32 runtime
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-32bit.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          EMU="$(find build/liveexec-package/Payload -maxdepth 1 -type d -name 'LiveExec32.app' -print -quit)"
          test -n "$APP"
          test -n "$EMU"
          rm -rf "$APP/LiveExec32.app"
          ditto "$EMU" "$APP/LiveExec32.app"
          test -f "$APP/LiveExec32.app/$LIVEEXEC_LOAD_PATH"
          test -d "$APP/LiveExec32.app/RootFS"

          find "$APP" -type d -name '_CodeSignature' -prune -exec rm -rf {} + || true
          find "$APP" -type f -name 'embedded.mobileprovision' -delete || true

      - name: Validate integrated archive
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-32bit.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -f "$APP/$EXECUTABLE"
          file "$APP/$EXECUTABLE" | grep -q 'arm64'

          EMU="$APP/LiveExec32.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitTranslationLayer' "$EMU/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledSourceCommit' "$EMU/Info.plist")" = "$LIVEEXEC_SOURCE_COMMIT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledBuildRevision' "$EMU/Info.plist")" = "$LIVEEXEC_BUILD_REVISION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorLoadPath' "$EMU/Info.plist")" = "$LIVEEXEC_LOAD_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitEmulatorEntrySymbol' "$EMU/Info.plist")" = "$LIVEEXEC_ENTRY_SYMBOL"
          nm -gU "$EMU/$LIVEEXEC_LOAD_PATH" | grep -q '_LC32RunGuest'
          test -f "$EMU/RootFS/usr/lib/libstdc++.6.dylib"
          test -f "$EMU/RootFS/usr/lib/libiconv.2.dylib"
          test -f "$EMU/RootFS/usr/lib/libcharset.1.dylib"

          if find "$APP" \( -name '_CodeSignature' -o -name 'embedded.mobileprovision' \) -print -quit | grep -q .; then
            echo 'Residual signing material found in unsigned package'
            exit 1
          fi

          grep -q 'LCSelected32BitEmulator' LiveContainer/LCBootstrap.m
          grep -q 'appMain(argc, argv, environ)' LiveContainer/LCBootstrap.m
          grep -q 'emulatorArgv0' LiveContainer/LCBootstrap.m
          grep -q 'seedBundled32BitRuntime' LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          grep -q 'container.filesAppURL' LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift
          ! grep -q 'if !model.uiIsShared, model.uiSelectedContainer != nil' LiveContainerSwiftUI/Views/AppList/LCAppBanner/LCAppBannerViewController.swift

      - name: Package unsigned FlekDeck IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/FlekDeck-32bit.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP" "build/Payload/$(basename "$APP")"
          cd build
          zip -qry FlekDeck-32bit-temp-unsigned.ipa Payload
          unzip -t FlekDeck-32bit-temp-unsigned.ipa >/dev/null
          unzip -l FlekDeck-32bit-temp-unsigned.ipa | grep -q '/LiveExec32.app/RootFS/'
          shasum -a 256 FlekDeck-32bit-temp-unsigned.ipa | tee FlekDeck-32bit-temp-unsigned.sha256
          ls -lh FlekDeck-32bit-temp-unsigned.ipa FlekDeck-32bit-temp-unsigned.sha256

      - name: Upload temp IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-32bit-temp-unsigned
          path: |
            build/FlekDeck-32bit-temp-unsigned.ipa
            build/FlekDeck-32bit-temp-unsigned.sha256
          if-no-files-found: error
          compression-level: 0
