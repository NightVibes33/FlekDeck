name: Apply Parallel guest layout fix

on:
  push:
    branches:
      - experiment/parallel-guest-layout-safearea
    paths:
      - 'Tools/patch_parallel_guest_layout.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/parallel-guest-layout-safearea
          fetch-depth: 1

      - name: Patch Parallel-only hosted guest geometry
        run: |
          set -euo pipefail
          python3 Tools/patch_parallel_guest_layout.py
          git diff --check
          git diff -- MultitaskSupport/DecoratedAppSceneViewController.m

      - name: Commit source fix
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- MultitaskSupport/DecoratedAppSceneViewController.m)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MultitaskSupport/DecoratedAppSceneViewController.m
          git commit -m "Keep Parallel guest drawable synced with final host bounds"
          git push origin HEAD:experiment/parallel-guest-layout-safearea
