name: iOS Device Unsigned IPA

# Legacy build: main uses build-unsigned-ipa.yml.
# Temp multitask branch self-validates this exact workflow and its direct-build
# compatibility bridge without triggering the other IPA workflows.
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/multitask-control-jit-diagnosis
    paths:
      - '.github/workflows/build.yml'
      - 'MultitaskSupport/MultitaskDockManager+VibeCompat.swift'
      - 'LiveContainerSwiftUI/Utilities/LCUtils.h'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Build real-device unsigned archive
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          xcodebuild clean archive \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | xcpretty
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- compiler/linker errors ---'
            grep -nE '(^| )error:|fatal error:|Undefined symbols|duplicate symbol|ld:' build/xcodebuild.log | tail -250 || true
            exit "$status"
          fi

      - name: Validate device build
        run: |
          set -euo pipefail
          APP="build/FlekDeck.xcarchive/Products/Applications/FlekDeck.app"
          test -d "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -f "$APP/$EXECUTABLE"
          echo "Executable: $EXECUTABLE"
          file "$APP/$EXECUTABLE"
          xcrun vtool -show-build "$APP/$EXECUTABLE" | tee build/device-build.txt
          grep -Eiq 'platform[[:space:]]+(IOS|2)' build/device-build.txt
          if find "$APP" -name '_CodeSignature' -o -name 'embedded.mobileprovision' | grep -q .; then
            echo "Unexpected signing material found"
            exit 1
          fi

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/FlekDeck.xcarchive/Products/Applications/FlekDeck.app build/Payload/
          cd build
          zip -qry FlekDeck-unsigned-device.ipa Payload
          test -s FlekDeck-unsigned-device.ipa
          unzip -l FlekDeck-unsigned-device.ipa | grep -q 'Payload/FlekDeck.app/Info.plist'
          ls -lh FlekDeck-unsigned-device.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-unsigned-device
          path: build/FlekDeck-unsigned-device.ipa
          if-no-files-found: error
          compression-level: 0
