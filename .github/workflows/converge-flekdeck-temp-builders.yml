name: Converge FlekDeck Temp Builders

on:
  workflow_dispatch:
  push:
    branches: [temp/32bit-liveexec-data-folder]
    paths:
      - 'Tools/patch_flekdeck_workflow_convergence.py'
      - '.github/workflows/converge-flekdeck-temp-builders.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make final audit canonical
        run: |
          set -euxo pipefail
          python3 Tools/patch_flekdeck_workflow_convergence.py
          git diff --check
          grep -q 'workflow_call:' .github/workflows/flekdeck-final-ondevice-audit.yml
          for f in \
            .github/workflows/build-flekdeck-full-parity-temp.yml \
            .github/workflows/build-flekdeck-32bit-temp.yml \
            .github/workflows/build-flekdeck-32bit-parity-temp.yml; do
            grep -q 'flekdeck-final-ondevice-audit.yml' "$f"
            ! grep -q 'patch_direct_multitask_host_bridge.py' "$f"
          done

      - name: Bake workflow convergence
        run: |
          set -euxo pipefail
          git add -- \
            .github/workflows/flekdeck-final-ondevice-audit.yml \
            .github/workflows/build-flekdeck-full-parity-temp.yml \
            .github/workflows/build-flekdeck-32bit-temp.yml \
            .github/workflows/build-flekdeck-32bit-parity-temp.yml
          if git diff --cached --quiet; then
            echo 'Temp builders already converge on Final On-Device Audit.'
            exit 0
          fi
          git config user.name 'NightVibes33 Actions'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Converge temp builders on audited runtime path'
          git push origin HEAD:temp/32bit-liveexec-data-folder
