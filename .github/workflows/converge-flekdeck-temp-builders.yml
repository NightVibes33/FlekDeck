name: Validate FlekDeck Temp Builders

on:
  workflow_dispatch:
  push:
    branches: [temp/32bit-liveexec-data-folder]
    paths:
      - 'Tools/patch_flekdeck_workflow_convergence.py'
      - '.github/workflows/converge-flekdeck-temp-builders.yml'
      - '.github/workflows/build-flekdeck-sidestore-parity-temp.yml'
      - '.github/workflows/build-flekdeck-full-parity-temp.yml'
      - '.github/workflows/build-flekdeck-32bit-temp.yml'
      - '.github/workflows/build-flekdeck-32bit-parity-temp.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SideStore-compatible builder is canonical
        run: |
          set -euxo pipefail
          grep -q 'workflow_call:' .github/workflows/build-flekdeck-sidestore-parity-temp.yml
          grep -q 'test "$BUNDLE_ID" = "com.fs.flekdeck"' .github/workflows/build-flekdeck-sidestore-parity-temp.yml
          grep -q 'AAAAA11111.com.fs.flekdeck' .github/workflows/build-flekdeck-sidestore-parity-temp.yml
          grep -q 'patch_flekdeck_sidestore_identity.py' .github/workflows/build-flekdeck-sidestore-parity-temp.yml
          for f in \
            .github/workflows/build-flekdeck-full-parity-temp.yml \
            .github/workflows/build-flekdeck-32bit-temp.yml \
            .github/workflows/build-flekdeck-32bit-parity-temp.yml; do
            grep -q 'build-flekdeck-sidestore-parity-temp.yml' "$f"
            ! grep -q 'flekdeck-final-ondevice-audit.yml' "$f"
            ! grep -q 'patch_direct_multitask_host_bridge.py' "$f"
          done
