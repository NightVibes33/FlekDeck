name: Certificate Import Fix

# Legacy build: main uses vibecontainers-fast-ipa.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Patch certificate import state
        run: python3 Tools/patch_cert_import_state.py

      - name: Parse patched Settings
        run: xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift

      - name: Persist certificate fix
        run: |
          set -euo pipefail
          if git diff --quiet -- LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift; then
            echo 'Certificate fix already persisted'
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
            git commit -m 'Fix SideStore p12 certificate import state'
            git push origin HEAD:main
          fi

      - name: Build unsigned real-device archive
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -archivePath "$PWD/build/FlekDeck.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find "$PWD/build/FlekDeck.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry FlekDeck-p12-import-fixed.ipa Payload
          unzip -t FlekDeck-p12-import-fixed.ipa >/dev/null
          test -s FlekDeck-p12-import-fixed.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlekDeck-p12-import-fixed-ipa
          path: build/FlekDeck-p12-import-fixed.ipa
          if-no-files-found: error
