name: Repair Parallel post-launch viewport snap

on:
  push:
    branches:
      - experiment/parallel-guest-layout-safearea
    paths:
      - '.github/workflows/repair-parallel-postlaunch-viewport.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/parallel-guest-layout-safearea
          fetch-depth: 0

      - name: Patch stale post-launch guest frame
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git diff --check

      - name: Commit repair and trigger signer build
        shell: bash
        run: |
          printf 'trigger: 2026-09-11T05:35:00Z\nreason: post-launch guest drawable uses final maximized bounds\n' > .github/trigger-unsigned-ipa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MultitaskSupport/AppSceneViewController.m .github/trigger-unsigned-ipa
          git commit -m 'Fix Parallel post-launch viewport snap'
          git push origin HEAD:experiment/parallel-guest-layout-safearea
