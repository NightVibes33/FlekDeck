name: Restore PiP patches to signer build

on:
  push:
    branches:
      - experiment/parallel-guest-layout-safearea
    paths:
      - '.github/workflows/restore-pip-signer-build.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/parallel-guest-layout-safearea
          fetch-depth: 0

      - name: Restore PiP compatibility stack to signer build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-unsigned-ipa.yml')
          s = p.read_text()
          apply_anchor = "          python3 Tools/patch_free_sidestore_support.py\n"
          pip_apply = apply_anchor + "          # Re-apply the working PiP compatibility stack after the pinned Vibe core copy.\n          python3 Tools/patch_guest_native_pip_bridge.py\n          python3 Tools/patch_youtube_native_pip_render.py\n          python3 Tools/patch_pip_state_separation.py\n"
          if 'python3 Tools/patch_guest_native_pip_bridge.py' not in s:
              if apply_anchor not in s:
                  raise SystemExit('compatibility-layer anchor missing')
              s = s.replace(apply_anchor, pip_apply, 1)
          verify_anchor = "          grep -q 'bookmarkDataWithOptions' MultitaskSupport/AppSceneViewController.m\n"
          pip_verify = verify_anchor + "          grep -q 'LCGuestNativePiPBridge' LiveContainer/LCBootstrap.m\n          grep -q 'sampleBufferDisplayLayer' LiveContainer/LCBootstrap.m\n          grep -q 'LCYouTubePiPRefreshSource' LiveContainer/LCBootstrap.m\n          grep -q 'newContentSource' LiveContainer/LCBootstrap.m\n          grep -q 'startWindowPiPWithVC' MultitaskSupport/PiPManager.m\n          grep -q 'LCNativePiPDoesNotOwnWindowLifecycle' MultitaskSupport/PiPManager.m\n          grep -q 'LCNativePiPAutoWindowFallback' MultitaskSupport/PiPManager.m\n"
          if "grep -q 'LCGuestNativePiPBridge' LiveContainer/LCBootstrap.m" not in s:
              if verify_anchor not in s:
                  raise SystemExit('PiP verification anchor missing')
              s = s.replace(verify_anchor, pip_verify, 1)
          switcher_anchor = "          xcrun swiftc -frontend -parse MultitaskSupport/MultitaskDockView.swift\n"
          switcher_guard = switcher_anchor + "          ! grep -q 'LCPersistentSwitcherSwipeInvariant' MultitaskSupport/MultitaskDockView.swift\n          ! grep -q 'FlekImmediateSwitcherSwipeBridge' MultitaskSupport/MultitaskDockView.swift\n"
          if "! grep -q 'LCPersistentSwitcherSwipeInvariant'" not in s:
              if switcher_anchor not in s:
                  raise SystemExit('switcher verification anchor missing')
              s = s.replace(switcher_anchor, switcher_guard, 1)
          p.write_text(s)
          PY
          git diff --check

      - name: Commit repair and trigger signer IPA
        shell: bash
        run: |
          set -euo pipefail
          printf 'trigger: 2026-09-11T06:05:00Z\nreason: restore native and YouTube PiP patch stack in signer build\n' > .github/trigger-unsigned-ipa
          git rm .github/workflows/restore-pip-signer-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-unsigned-ipa.yml .github/trigger-unsigned-ipa
          git commit -m 'Restore PiP stack in signer-compatible build'
          git push origin HEAD:experiment/parallel-guest-layout-safearea
